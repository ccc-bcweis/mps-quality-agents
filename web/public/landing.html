<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Precision Systems · Fab Ops Console</title>
    <link rel="icon" href="/logo-concept-1.svg" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0E1116; color: #F8FAFC; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      main { width: min(28rem, calc(100vw - 2rem)); padding: 2rem; border: 1px solid #3D4654; border-radius: 0.5rem; background: #1A1F27; text-align: center; }
      .brand { display: flex; align-items: center; justify-content: center; gap: 0.75rem; text-align: left; }
      .name { display: block; font-size: 1.125rem; font-weight: 600; }
      .product { display: block; font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #94A3B8; }
      p { color: #E5E7EB; margin: 1.5rem 0; }
      a.login { display: inline-flex; align-items: center; justify-content: center; padding: 0.5rem 1.25rem; border-radius: 0.25rem; background: #047857; color: #FFFFFF; font-weight: 600; text-decoration: none; }
      a.login:hover { filter: brightness(1.1); }
      a.login:focus-visible { outline: 2px solid #22D3EE; outline-offset: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/logo-concept-1.svg" width="48" height="48" alt="Meridian Precision Systems mark" />
        <span>
          <span class="name">Meridian Precision Systems</span>
          <span class="product">Fab Ops Console</span>
        </span>
      </div>
      <h1 id="landing-title" style="font-size: 1.25rem; margin: 1.5rem 0 0">Welcome to the Fab Ops Console</h1>
      <p id="landing-message">Log in with your organization account to open the console.</p>
      <a class="login" id="landing-action" href="/.auth/login/aad?prompt=select_account&amp;post_login_redirect_uri=/" data-log-in>Log in</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next");
        var target = next && next.charAt(0) === "/" && next.charAt(1) !== "/" && next.charAt(1) !== "\\" ? next : "/";
        var action = document.getElementById("landing-action");
        var title = document.getElementById("landing-title");
        var message = document.getElementById("landing-message");
        var picker = "/.auth/login/aad?prompt=select_account&post_login_redirect_uri=" + (target === "/" ? "/" : encodeURIComponent(target));
        action.setAttribute("href", picker);
        if (params.has("signedOut")) {
          title.textContent = "You are signed out.";
        }

        function noAccess(name) {
          title.textContent = "No access";
          message.textContent = name
            ? "Signed in as " + name + ", which has no access. Use a different account, or ask the owner for a join link."
            : "This account has no access. Use a different account, or ask the owner for a join link.";
          action.textContent = "Use a different account";
          action.setAttribute("data-different-account", "");
        }

        function claim(user, types) {
          var claims = (user && user.user_claims) || [];
          for (var t = 0; t < types.length; t++) {
            for (var c = 0; c < claims.length; c++) {
              if (claims[c].typ === types[t] && claims[c].val) return claims[c].val;
            }
          }
          return user && user.user_id ? user.user_id : null;
        }

        fetch("/.auth/me", { credentials: "same-origin", headers: { accept: "application/json" } })
          .then(function (response) { return response.ok ? response.json() : []; })
          .then(function (users) {
            var user = Array.isArray(users) && users.length > 0 ? users[0] : null;
            if (!user) return;
            var name = claim(user, ["preferred_username", "name", "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"]);
            if (params.has("noAccess")) {
              noAccess(name);
              return;
            }
            return fetch("/api/admin/session", { credentials: "same-origin", headers: { accept: "application/json" } }).then(function (response) {
              if (response.status === 403) {
                noAccess(name);
                return;
              }
              if (!response.ok) return;
              return response.json().then(function (session) {
                if (session && session.member === false) noAccess(name);
                else window.location.replace(target);
              });
            });
          })
          .catch(function () {
            // Keep the Log in button.
          });
      })();
    </script>
  </body>
</html>
