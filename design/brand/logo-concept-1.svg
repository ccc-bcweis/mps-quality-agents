<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MPS logo concept 1 — True Meridian</title>
  <desc id="desc">A 300 mm wafer disc with orientation notch, metrology reticle, and a vertical meridian through the origin. Cyan on charcoal.</desc>
  <rect width="64" height="64" rx="8" fill="#0E1116"/>
  <!-- outer wafer -->
  <circle cx="32" cy="31" r="22" fill="#1A1F27" stroke="#22D3EE" stroke-width="1.6"/>
  <!-- inner exclusion / chuck ring -->
  <circle cx="32" cy="31" r="16.5" fill="none" stroke="#3D4654" stroke-width="0.8"/>
  <!-- faint die grid -->
  <g stroke="#3D4654" stroke-width="0.35" opacity="0.7">
    <path d="M20 23.5 H44 M20 27 H44 M20 31 H44 M20 35 H44 M20 38.5 H44"/>
    <path d="M23.5 19.5 V42.5 M27 19.5 V42.5 M32 19.5 V42.5 M37 19.5 V42.5 M40.5 19.5 V42.5"/>
  </g>
  <!-- wafer notch (SEMICON orientation) -->
  <path d="M28.6 52.2 C30.2 54.6 33.8 54.6 35.4 52.2" fill="#0E1116" stroke="#22D3EE" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cardinal ticks -->
  <g stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round">
    <path d="M32 7.5 V11.2"/>
    <path d="M32 50.8 V53.2"/>
    <path d="M9.5 31 H13.2"/>
    <path d="M50.8 31 H54.5"/>
  </g>
  <!-- sub-ticks -->
  <g stroke="#22D3EE" stroke-width="0.7" stroke-linecap="round" opacity="0.85">
    <path d="M16.2 15.2 l2.2 2.2"/>
    <path d="M45.6 15.2 l-2.2 2.2"/>
    <path d="M16.2 46.8 l2.2 -2.2"/>
    <path d="M45.6 46.8 l-2.2 -2.2"/>
  </g>
  <!-- meridian (true north through origin) -->
  <line x1="32" y1="10.5" x2="32" y2="51.5" stroke="#22D3EE" stroke-width="1.35"/>
  <!-- crosshair, shorter -->
  <line x1="14" y1="31" x2="50" y2="31" stroke="#22D3EE" stroke-width="0.7" opacity="0.75"/>
  <!-- origin diamond: alignment mark -->
  <path d="M32 27.2 L35.4 31 L32 34.8 L28.6 31 Z" fill="#22D3EE"/>
  <circle cx="32" cy="31" r="1.15" fill="#0E1116"/>
</svg>
