name: Quality

# Nightly and on demand. Not a pull_request check. Do not mark this workflow required
# until the Domain mutation score is at least 60%.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MPS.sln

      - name: Build
        run: dotnet build MPS.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test MPS.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage --settings coverlet.runsettings

      - name: Coverage report
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" dotnet-reportgenerator-globaltool --version 5.5.11
          "$RUNNER_TEMP/tools/reportgenerator" -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-coverage-report
          path: coverage/report
          if-no-files-found: error

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore Stryker
        run: dotnet tool restore

      # Measured on lane/5-qa on 2026-10-14: Domain score 27.68%, under the 60 break.
      # The filter keeps solution mode on the domain tests. PendingLane tests are not in that set.
      - name: Mutate Domain
        run: dotnet tool run dotnet-stryker -- --config-file stryker-config.json --skip-version-check --output StrykerOutput/domain

      - name: Mutate Application
        # Application is interfaces plus an excluded anchor, so this run can produce
        # zero mutants. The break stays at 0 until the project has behavior to kill.
        run: dotnet tool run dotnet-stryker -- --config-file stryker-application.json --skip-version-check --output StrykerOutput/application

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: StrykerOutput/**/*.html
          if-no-files-found: warn
