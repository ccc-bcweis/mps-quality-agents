# Manual only. The trigger is workflow_dispatch. Nothing else starts this workflow.
# Environment azure-demo needs a required reviewer, which Bob configures in GitHub.
# OIDC uses secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID.
# Easy Auth uses variables RESOURCE_GROUP, ENTRA_CLIENT_ID, ENTRA_ISSUER, and BUDGET_EMAIL.
# Admins: input adminEmails, else variable ADMIN_EMAILS, else the list on the running app. With none, it stops before any change.
# A fork or clone without these secrets and variables skips cleanly: the OIDC credential only trusts this repo's azure-demo environment.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Image tag. Leave blank to use the commit SHA.
        required: false
        type: string
        default: ""
      adminEmails:
        description: Admin emails, comma separated. Blank uses the ADMIN_EMAILS variable, else the running app's list.
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: azure-demo
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_ISSUER: ${{ vars.ENTRA_ISSUER }}
      BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      ADMIN_EMAILS_INPUT: ${{ inputs.adminEmails || vars.ADMIN_EMAILS }}
      IMAGE_TAG: ${{ inputs.imageTag || github.sha }}
      BOOTSTRAP_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
    steps:
      - name: Check Azure setup
        id: setup
        shell: bash
        env:
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CLIENT" = "true" ] && [ "$HAS_TENANT" = "true" ] && [ "$HAS_SUBSCRIPTION" = "true" ] && [ -n "$RESOURCE_GROUP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Azure is not set up for this repository (secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and variable RESOURCE_GROUP). Skipping the deploy. See README 'Deploy to your own Azure'."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login
        if: steps.setup.outputs.ready == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require environment variables
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in RESOURCE_GROUP ENTRA_CLIENT_ID ENTRA_ISSUER IMAGE_TAG; do
            if [ -z "${!name}" ]; then
              echo "Missing $name. Set it on the azure-demo environment. A blank image tag uses the commit SHA."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve admin emails
        if: steps.setup.outputs.ready == 'true'
        id: admins
        shell: bash
        run: |
          set -euo pipefail
          # Order: workflow input, then the ADMIN_EMAILS variable, then the list on the running app, so a deploy keeps its admins.
          admins="$ADMIN_EMAILS_INPUT"
          source="input or ADMIN_EMAILS variable"
          if [ -z "$admins" ]; then
            app="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.appName.value -o tsv 2>/dev/null || true)"
            app="${app:-$(az containerapp list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv 2>/dev/null || true)}"
            if [ -n "$app" ]; then
              admins="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app" --query "properties.template.containers[0].env[?name=='Mps__Auth__AdminEmails'].value | [0]" -o tsv 2>/dev/null || true)"
              source="running app $app"
            fi
          fi
          if [ -z "$admins" ] && [ -n "$ENTRA_CLIENT_ID" ]; then
            echo "No admin email. Set the ADMIN_EMAILS variable on the azure-demo environment or the adminEmails input. Nothing was changed."
            exit 1
          fi
          count="$(printf '%s' "$admins" | tr ',;' '\n\n' | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          echo "Admin emails: ${count} from ${source}."
          echo "list=${admins}" >> "$GITHUB_OUTPUT"

      - name: Deploy bootstrap so the registry exists
        if: steps.setup.outputs.ready == 'true'
        env:
          ADMIN_EMAILS: ${{ steps.admins.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name mps-demo \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters \
              apiImage="$BOOTSTRAP_IMAGE" \
              entraClientId="$ENTRA_CLIENT_ID" \
              openIdIssuer="$ENTRA_ISSUER" \
              adminEmails="$ADMIN_EMAILS" \
              budgetContactEmail="$BUDGET_EMAIL" \
              deploySql=false \
              deployStaticWeb=false

      - name: Read registry outputs
        if: steps.setup.outputs.ready == 'true'
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          echo "name=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.acrName.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "server=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.acrLoginServer.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "id=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.acrId.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "principal=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.identityPrincipalId.value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Wait for AcrPull on the app identity
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(az role assignment list --assignee-object-id "${{ steps.acr.outputs.principal }}" --scope "${{ steps.acr.outputs.id }}" --query "[?roleDefinitionName=='AcrPull'] | length(@)" -o tsv)"
            if [ "${count:-0}" != "0" ]; then
              echo "AcrPull is visible."
              exit 0
            fi
            echo "AcrPull not visible yet (attempt ${attempt})."
            sleep 10
          done
          echo "AcrPull was not visible after two minutes."
          exit 1

      - name: Build the app image in the registry
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "${{ steps.acr.outputs.name }}" \
            --image "mps-app:${IMAGE_TAG}" \
            --file deploy/app.Dockerfile \
            .

      - name: Deploy the app image
        if: steps.setup.outputs.ready == 'true'
        id: app
        env:
          ADMIN_EMAILS: ${{ steps.admins.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.acr.outputs.server }}/mps-app:${IMAGE_TAG}"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name mps-demo \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters \
              apiImage="$image" \
              entraClientId="$ENTRA_CLIENT_ID" \
              openIdIssuer="$ENTRA_ISSUER" \
              adminEmails="$ADMIN_EMAILS" \
              budgetContactEmail="$BUDGET_EMAIL" \
              deploySql=false \
              deployStaticWeb=false
          fqdn="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name mps-demo --query properties.outputs.appFqdn.value -o tsv)"
          echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"
          echo "Demo URL: https://${fqdn}"

      - name: Smoke check anonymous access
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Easy Auth allows anonymous requests; the app gates them. Health is open, the API answers 401,
          # and a signed-out browser opening the console is sent to the landing page.
          base="https://${{ steps.app.outputs.fqdn }}"
          health="000"; api="000"; console="000"
          for attempt in $(seq 1 10); do
            health="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 45 "$base/health" || echo 000)"
            api="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 45 "$base/api/tools" || echo 000)"
            console="$(curl --silent --output /dev/null --write-out "%{http_code} %{redirect_url}" --max-time 45 -H 'Accept: text/html' "$base/" || echo 000)"
            echo "attempt ${attempt}: health ${health}, api ${api}, console ${console}"
            if [ "$health" = "200" ] && [ "$api" = "401" ] && [ "$console" = "302 $base/landing.html" ]; then
              echo "Demo URL: $base"
              exit 0
            fi
            sleep 15
          done
          echo "Expected health 200, API 401 and the console redirected to /landing.html for an anonymous caller."
          exit 1
