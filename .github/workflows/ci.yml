name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MPS.sln

      - name: Vulnerable packages (direct and transitive)
        run: |
          dotnet list MPS.sln package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/vulnerable.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable.txt"; then
            echo "::error::A NuGet package has a known vulnerability. Pin a fixed version in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build MPS.sln --configuration Release --no-restore

      - name: Format
        run: dotnet format MPS.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test MPS.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage --settings coverlet.runsettings

      - name: Eval (replay mode, gates)
        run: dotnet run --project eval/Eval.Runner --configuration Release --no-build -- eval/cases "$RUNNER_TEMP/eval-latest.json"

      - name: Coverage report
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" dotnet-reportgenerator-globaltool --version 5.5.11
          "$RUNNER_TEMP/tools/reportgenerator" -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: error

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No web app yet
        if: hashFiles('web/package.json') == ''
        run: echo "No web/package.json. Skipping web lint and test."

      - name: Setup Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint, test, and build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run lint && npm test && npm run build

      - name: Production dependency audit
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  bicep:
    name: bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" "https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version

      - name: Build
        run: |
          if [ ! -f infra/main.bicep ]; then
            echo "infra/main.bicep is not present. Skipping Bicep build."
            exit 0
          fi
          "$RUNNER_TEMP/bicep" build infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
