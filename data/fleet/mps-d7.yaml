      - id: measure
        name: Measure
        windows:
          - { parameter: filmThickness, unit: nm, minimum: 80, maximum: 120, nominal: 100 }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.5, nominal: 1.0 }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2 }
          - { parameter: heaterTemperature, unit: C, minimum: 360, maximum: 385, nominal: 372, idle: true }
          - { parameter: chamberPressure, unit: Torr, minimum: 2.4, maximum: 3.6, nominal: 3.0, idle: true }
          - { parameter: rfPower, unit: W, minimum: 350, maximum: 500, nominal: 420, idle: true }
          - { parameter: sih4Flow, unit: sccm, minimum: 12, maximum: 28, nominal: 18, idle: true }
          - { parameter: n2oFlow, unit: sccm, minimum: 250, maximum: 500, nominal: 360, idle: true }
          - { parameter: nh3Flow, unit: sccm, minimum: 40, maximum: 90, nominal: 60, idle: true }
