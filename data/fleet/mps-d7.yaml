# Copyright (c) 2026 Bryan C. Weis and Common Consulting Company
# Synthetic Meridian Precision Systems fleet. Fictional model MPS-D7.
# Every recipe step defines every parameter: its own window, or idle: true with a window when the step does not
# control that parameter. FleetSchema checks this at load. There is no fallback to another step or to the sensor range.
# SPC limits are that step's window (center plus or minus three sigma), clamped to the sensor minimum and maximum
# (the physical floor and ceiling, equal to the family envelope). They are not statistics of the telemetry.
# During a fault the band keeps following the recipe step.
family: deposition
model: MPS-D7
recipes:
  - id: PECVD-OXIDE
    name: PECVD oxide
    steps:
      - id: stabilize
        name: Stabilize
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 2.8, maximum: 4.2, nominal: 3.5 }
          - { parameter: heaterTemperature, unit: C, minimum: 365, maximum: 385, nominal: 375 }
          - { parameter: rfPower, unit: W, minimum: 400, maximum: 550, nominal: 480, idle: true }
          - { parameter: sih4Flow, unit: sccm, minimum: 18, maximum: 32, nominal: 24, idle: true }
          - { parameter: n2oFlow, unit: sccm, minimum: 600, maximum: 900, nominal: 750, idle: true }
          - { parameter: nh3Flow, unit: sccm, minimum: 40, maximum: 90, nominal: 60, idle: true }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.0, nominal: 0.7, idle: true }
          - { parameter: waferCenterOffset, unit: mm, minimum: 0, maximum: 0.12, nominal: 0.04, idle: true }
          - { parameter: filmThickness, unit: nm, minimum: 180, maximum: 220, nominal: 200, idle: true }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.0, nominal: 0.8, idle: true }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2, idle: true }
      - id: deposit
        name: Deposit
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 3.0, maximum: 4.5, nominal: 3.6 }
          - { parameter: heaterTemperature, unit: C, minimum: 370, maximum: 390, nominal: 380 }
          - { parameter: rfPower, unit: W, minimum: 400, maximum: 550, nominal: 480 }
          - { parameter: sih4Flow, unit: sccm, minimum: 18, maximum: 32, nominal: 24 }
          - { parameter: n2oFlow, unit: sccm, minimum: 600, maximum: 900, nominal: 750 }
          - { parameter: waferCenterOffset, unit: mm, minimum: 0, maximum: 0.12, nominal: 0.04 }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.0, nominal: 0.7 }
          - { parameter: nh3Flow, unit: sccm, minimum: 40, maximum: 90, nominal: 60, idle: true }
          - { parameter: filmThickness, unit: nm, minimum: 180, maximum: 220, nominal: 200, idle: true }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.0, nominal: 0.8, idle: true }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2, idle: true }
      - id: measure
        name: Measure
        windows:
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2 }
          - { parameter: filmThickness, unit: nm, minimum: 180, maximum: 220, nominal: 200 }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.0, nominal: 0.8 }
          - { parameter: heaterTemperature, unit: C, minimum: 365, maximum: 385, nominal: 375, idle: true }
          - { parameter: chamberPressure, unit: Torr, minimum: 2.8, maximum: 4.2, nominal: 3.5, idle: true }
          - { parameter: rfPower, unit: W, minimum: 400, maximum: 550, nominal: 480, idle: true }
          - { parameter: sih4Flow, unit: sccm, minimum: 18, maximum: 32, nominal: 24, idle: true }
          - { parameter: n2oFlow, unit: sccm, minimum: 600, maximum: 900, nominal: 750, idle: true }
          - { parameter: nh3Flow, unit: sccm, minimum: 40, maximum: 90, nominal: 60, idle: true }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.0, nominal: 0.7, idle: true }
          - { parameter: waferCenterOffset, unit: mm, minimum: 0, maximum: 0.12, nominal: 0.04, idle: true }
