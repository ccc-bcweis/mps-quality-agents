# Synthetic Meridian Precision Systems fleet. Fictional model MPS-D7.
family: deposition
model: MPS-D7
recipes:
  - id: PECVD-OXIDE
    name: PECVD oxide
    steps:
      - id: stabilize
        name: Stabilize
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 2.8, maximum: 4.2, nominal: 3.5 }
          - { parameter: heaterTemperature, unit: C, minimum: 365, maximum: 385, nominal: 375 }
      - id: deposit
        name: Deposit
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 3.0, maximum: 4.5, nominal: 3.6 }
          - { parameter: heaterTemperature, unit: C, minimum: 370, maximum: 390, nominal: 380 }
          - { parameter: rfPower, unit: W, minimum: 400, maximum: 550, nominal: 480 }
          - { parameter: sih4Flow, unit: sccm, minimum: 18, maximum: 32, nominal: 24 }
          - { parameter: n2oFlow, unit: sccm, minimum: 600, maximum: 900, nominal: 750 }
          - { parameter: waferCenterOffset, unit: mm, minimum: 0, maximum: 0.12, nominal: 0.04 }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.0, nominal: 0.7 }
      - id: measure
        name: Measure
        windows:
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2 }
          - { parameter: filmThickness, unit: nm, minimum: 180, maximum: 220, nominal: 200 }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.0, nominal: 0.8 }
  - id: PECVD-NITRIDE
    name: PECVD nitride
    steps:
      - id: stabilize
        name: Stabilize
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 2.4, maximum: 3.6, nominal: 3.0 }
          - { parameter: heaterTemperature, unit: C, minimum: 360, maximum: 385, nominal: 372 }
      - id: deposit
        name: Deposit
        windows:
          - { parameter: heaterTemperature, unit: C, minimum: 368, maximum: 388, nominal: 378 }
          - { parameter: rfPower, unit: W, minimum: 350, maximum: 500, nominal: 420 }
          - { parameter: sih4Flow, unit: sccm, minimum: 12, maximum: 28, nominal: 18 }
          - { parameter: nh3Flow, unit: sccm, minimum: 40, maximum: 90, nominal: 60 }
          - { parameter: n2oFlow, unit: sccm, minimum: 250, maximum: 500, nominal: 360 }
      - id: measure
        name: Measure
        windows:
          - { parameter: filmThickness, unit: nm, minimum: 80, maximum: 120, nominal: 100 }
          - { parameter: filmUniformity, unit: percent, minimum: 0, maximum: 2.5, nominal: 1.0 }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 2 }
tools:
  - id: D-01
    name: Deposition D-01
    bay: Bay-1
    chambers:
      - { id: D-01-A, name: Chamber A }
      - { id: D-01-B, name: Chamber B }
  - id: D-02
    name: Deposition D-02
    bay: Bay-2
    chambers:
      - { id: D-02-A, name: Chamber A }
      - { id: D-02-B, name: Chamber B }
