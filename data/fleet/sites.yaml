# Three fictional plants. Positions, telemetry, and throughput come from Mps:Demo:Seed (default 4242).
# Place names are invented. Tool models stay the fictional MPS family names.
sites:
  - id: northwater
    name: Northwater Fab
    role: Front-end wafer fab
    location: Cedar Reach, Valecrest
    timezone: America/Denver
    toolPrefix: ""
    bays:
      - id: Bay-1
        name: Bay 1
        tools:
          - { id: D-01 }
          - { id: E-01 }
          - { id: S-01 }
          - { id: C-01 }
      - id: Bay-2
        name: Bay 2
        tools:
          - { id: D-02 }
          - { id: E-02 }
          - { id: S-02 }
          - { id: C-02 }
      - id: Bay-3
        name: Bay 3 deposition
        tools:
          - { id: D-03, template: D-01, name: Deposition D-03 }
          - { id: D-04, template: D-01, name: Deposition D-04 }
      - id: Bay-4
        name: Bay 4 etch
        tools:
          - { id: E-03, template: E-01, name: Etch E-03 }
          - { id: E-04, template: E-01, name: Etch E-04 }
    flows:
      - { fromBayId: Bay-3, toBayId: Bay-1, label: "Deposited wafers move to bay 1 for etch." }
      - { fromBayId: Bay-3, toBayId: Bay-2, label: "Deposited wafers move to bay 2 for etch." }
      - { fromBayId: Bay-1, toBayId: Bay-4, label: "Bay 1 wafers finish etch in bay 4." }
      - { fromBayId: Bay-2, toBayId: Bay-4, label: "Bay 2 wafers finish etch in bay 4." }
  - id: ironwood
    name: Ironwood Fab
    role: Front-end wafer fab
    location: Ironwood Bench, Eastmere
    timezone: America/Chicago
    toolPrefix: "I-"
    bays:
      - id: I-Bay-1
        name: Deposition 1
        tools:
          - { id: I-D-01, template: D-01, name: Deposition I-D-01 }
          - { id: I-D-02, template: D-01, name: Deposition I-D-02 }
      - id: I-Bay-2
        name: Etch
        tools:
          - { id: I-E-01, template: E-01, name: Etch I-E-01 }
          - { id: I-E-02, template: E-01, name: Etch I-E-02 }
          - { id: I-E-03, template: E-01, name: Etch I-E-03 }
      - id: I-Bay-3
        name: Deposition 2
        tools:
          - { id: I-D-03, template: D-01, name: Deposition I-D-03 }
          - { id: I-D-04, template: D-01, name: Deposition I-D-04 }
      - id: I-Bay-4
        name: Etch finish
        tools:
          - { id: I-E-04, template: E-01, name: Etch I-E-04 }
          - { id: I-S-01, template: S-01, name: Strip I-S-01 }
          - { id: I-C-01, template: C-01, name: Clean I-C-01 }
    flows:
      - { fromBayId: I-Bay-1, toBayId: I-Bay-2, label: "Wafers leave deposition for etch." }
      - { fromBayId: I-Bay-3, toBayId: I-Bay-2, label: "The second deposition bay feeds the same etch line." }
      - { fromBayId: I-Bay-2, toBayId: I-Bay-4, label: "Etch finishes, then a short strip and clean." }
    behavior:
      - { family: etch, parameter: escTemperature, meanOffset: 12, sigmaScale: 2.2 }
      - { family: etch, parameter: wallTemperature, meanOffset: 5, sigmaScale: 1.8 }
    kpiAdjust:
      - { family: etch, uptimeDelta: -4, yieldDelta: -2.5 }
  - id: lumen
    name: Lumen Pilot Works
    role: Strip, clean, and pilot line
    location: Lumen Yard, Westfold
    timezone: America/Los_Angeles
    toolPrefix: "P-"
    bays:
      - id: P-Bay-1
        name: Strip
        tools:
          - { id: P-S-01, template: S-01, name: Strip P-S-01 }
          - { id: P-S-02, template: S-01, name: Strip P-S-02 }
          - { id: P-S-03, template: S-01, name: Strip P-S-03 }
      - id: P-Bay-2
        name: Clean
        tools:
          - { id: P-C-01, template: C-01, name: Clean P-C-01 }
          - { id: P-C-02, template: C-01, name: Clean P-C-02 }
          - { id: P-C-03, template: C-01, name: Clean P-C-03 }
      - id: P-Bay-3
        name: Pilot deposition
        tools:
          - { id: P-D-01, template: D-01, name: Deposition P-D-01 }
          - { id: P-D-02, template: D-01, name: Deposition P-D-02 }
      - id: P-Bay-4
        name: Pilot etch
        tools:
          - { id: P-E-01, template: E-01, name: Etch P-E-01 }
          - { id: P-E-02, template: E-01, name: Etch P-E-02 }
    flows:
      - { fromBayId: P-Bay-3, toBayId: P-Bay-4, label: "Pilot wafers move from deposition to etch." }
      - { fromBayId: P-Bay-4, toBayId: P-Bay-1, label: "Pilot wafers move to strip." }
      - { fromBayId: P-Bay-1, toBayId: P-Bay-2, label: "Strip wafers move to clean." }
