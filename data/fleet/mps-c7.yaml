# Synthetic Meridian Precision Systems fleet. Fictional model MPS-C7. Single-wafer clean, one chamber.
family: clean
model: MPS-C7
recipes:
  - id: SC1-SC2
    name: SC1 SC2 clean
    steps:
      - id: sc1
        name: SC1
        windows:
          - { parameter: ambientPressure, unit: atm, minimum: 0.99, maximum: 1.01, nominal: 1.00 }
          - { parameter: bathTemperature, unit: C, minimum: 62, maximum: 68, nominal: 65 }
          - { parameter: sc1Flow, unit: L/min, minimum: 0.8, maximum: 1.4, nominal: 1.1 }
          - { parameter: megasonicPower, unit: W, minimum: 600, maximum: 800, nominal: 700 }
      - id: rinse
        name: Rinse
        windows:
          - { parameter: diwFlow, unit: L/min, minimum: 1.2, maximum: 2.0, nominal: 1.6 }
          - { parameter: bathTemperature, unit: C, minimum: 60, maximum: 66, nominal: 63 }
      - id: sc2
        name: SC2
        windows:
          - { parameter: sc2Flow, unit: L/min, minimum: 0.8, maximum: 1.4, nominal: 1.1 }
          - { parameter: bathTemperature, unit: C, minimum: 62, maximum: 68, nominal: 65 }
      - id: dry
        name: Dry
        windows:
          - { parameter: spinChuckRunout, unit: mm, minimum: 0, maximum: 0.08, nominal: 0.02 }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.2, nominal: 0.9 }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 4, nominal: 1 }
          - { parameter: residueCount, unit: count, minimum: 0, maximum: 3, nominal: 0 }
  - id: DIW-RINSE
    name: DIW rinse
    steps:
      - id: wet
        name: Wet
        windows:
          - { parameter: diwFlow, unit: L/min, minimum: 1.0, maximum: 1.8, nominal: 1.4 }
          - { parameter: bathTemperature, unit: C, minimum: 61, maximum: 67, nominal: 64 }
      - id: megasonic
        name: Megasonic
        windows:
          - { parameter: megasonicPower, unit: W, minimum: 550, maximum: 750, nominal: 650 }
      - id: dry
        name: Dry
        windows:
          - { parameter: spinChuckRunout, unit: mm, minimum: 0, maximum: 0.08, nominal: 0.02 }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 4, nominal: 1 }
tools:
  - id: C-01
    name: Clean C-01
    bay: Bay-1
    chambers:
      - { id: C-01-A, name: Chamber A }
  - id: C-02
    name: Clean C-02
    bay: Bay-2
    chambers:
      - { id: C-02-A, name: Chamber A }
