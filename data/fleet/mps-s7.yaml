# Synthetic Meridian Precision Systems fleet. Fictional model MPS-S7.
family: strip
model: MPS-S7
recipes:
  - id: ASH-STD
    name: Standard ash
    steps:
      - id: heat
        name: Heat
        windows:
          - { parameter: chamberPressure, unit: Torr, minimum: 0.9, maximum: 1.2, nominal: 1.05 }
          - { parameter: temperature, unit: C, minimum: 255, maximum: 270, nominal: 262 }
      - id: ash
        name: Ash
        windows:
          - { parameter: temperature, unit: C, minimum: 260, maximum: 275, nominal: 268 }
          - { parameter: chamberPressure, unit: Torr, minimum: 1.0, maximum: 1.3, nominal: 1.15 }
          - { parameter: remotePlasmaPower, unit: W, minimum: 2500, maximum: 3200, nominal: 2800 }
          - { parameter: o2Flow, unit: sccm, minimum: 1500, maximum: 2500, nominal: 2000 }
          - { parameter: n2h2Flow, unit: sccm, minimum: 200, maximum: 500, nominal: 320 }
          - { parameter: waferCenterOffset, unit: mm, minimum: 0, maximum: 0.12, nominal: 0.04 }
      - id: quench
        name: Quench
        windows:
          - { parameter: ashRate, unit: nm/min, minimum: 800, maximum: 1400, nominal: 1100 }
          - { parameter: particlesAdders, unit: count, minimum: 0, maximum: 8, nominal: 3 }
          - { parameter: vibrationRms, unit: mm/s, minimum: 0, maximum: 2.0, nominal: 0.7 }
  - id: ASH-HIGH
    name: High-dose ash
    steps:
      - id: heat
        name: Heat
        windows:
          - { parameter: temperature, unit: C, minimum: 265, maximum: 278, nominal: 272 }
          - { parameter: chamberPressure, unit: Torr, minimum: 0.95, maximum: 1.25, nominal: 1.1 }
      - id: ash
        name: Ash
        windows:
          - { parameter: remotePlasmaPower, unit: W, minimum: 3000, maximum: 3800, nominal: 3400 }
          - { parameter: o2Flow, unit: sccm, minimum: 2200, maximum: 3600, nominal: 2800 }
      - id: quench
        name: Quench
        windows:
          - { parameter: ashRate, unit: nm/min, minimum: 1200, maximum: 2000, nominal: 1600 }
tools:
  - id: S-01
    name: Strip S-01
    bay: Bay-1
    chambers:
      - { id: S-01-A, name: Chamber A }
      - { id: S-01-B, name: Chamber B }
  - id: S-02
    name: Strip S-02
    bay: Bay-2
    chambers:
      - { id: S-02-A, name: Chamber A }
      - { id: S-02-B, name: Chamber B }
