# Plain-language terms for console tooltips and the glossary page. All companies and data are fictional.
terms:
  - term: "ADR"
    expansion: "architecture decision record"
    plainDefinition: "A short written record of a design choice and the reason for it."
    whyItMatters: "It shows which choices are already settled, so a review does not reopen them by accident."
  - term: "AI"
    expansion: "artificial intelligence"
    plainDefinition: "Software that drafts a judgment from evidence instead of following only fixed rules."
    whyItMatters: "In this demo the model may suggest a cause, and a person still has to approve any action."
  - term: "ALN"
    expansion: "alignment"
    plainDefinition: "The sensor-id code for how squarely the wafer sits in the chamber."
    whyItMatters: "A wafer that sits off center can etch or coat the edge differently from the middle."
  - term: "AOAI"
    expansion: "Azure OpenAI"
    plainDefinition: "The hosted model service used when model mode is azure."
    whyItMatters: "It is the paid path, so the daily spend cap watches it. The hosted demo uses this path."
  - term: "API"
    expansion: "application programming interface"
    plainDefinition: "The agreed way one program asks another program for data."
    whyItMatters: "The console and the agents use the same API, so the screen and the investigation see the same facts."
  - term: "APIM"
    expansion: "API Management"
    plainDefinition: "A front door that would govern calls to the model in a production setup."
    whyItMatters: "It is how a real deployment would meter and protect model calls."
  - term: "APR"
    expansion: "approval"
    plainDefinition: "The step where a person accepts or rejects a recommended action."
    whyItMatters: "Nothing that changes the quality system happens before this step."
  - term: "AR"
    expansion: "autoregressive"
    plainDefinition: "A noise model where each reading leans a little on the reading just before it."
    whyItMatters: "It keeps the simulated traces smooth, the way a real sensor wanders, instead of jumping at random."
  - term: "Ar"
    expansion: "argon"
    plainDefinition: "An inert gas used to stabilize a plasma."
    whyItMatters: "The argon flow sets how the plasma carries energy to the wafer."
  - term: "ASP"
    expansion: "ASP.NET"
    plainDefinition: "The .NET web framework the demo API is built with."
    whyItMatters: "It is the program that serves the console and the investigation API."
  - term: "atm"
    expansion: "atmosphere"
    plainDefinition: "Ordinary air pressure. The clean tools run here, not in a vacuum."
    whyItMatters: "A clean tool that leaves this band is not holding a normal room condition."
  - term: "B2B"
    expansion: "business to business"
    plainDefinition: "A guest from another company who is invited into the sign-in directory."
    whyItMatters: "Reviewers can be invited without giving them an account inside the host company."
  - term: "Bay"
    expansion: "a group of tools"
    plainDefinition: "A set of tools that share a process step inside one plant."
    whyItMatters: "Wafers move from bay to bay. A problem that shows up in two bays is bigger than one tool."
  - term: "BM25"
    expansion: "Best Matching 25"
    plainDefinition: "A classic way to rank documents by how well the words match a question."
    whyItMatters: "It is half of the search that finds the procedure or bulletin an investigation cites."
  - term: "BOM"
    expansion: "bill of materials"
    plainDefinition: "The list of parts that make up a tool or an assembly."
    whyItMatters: "A changed part on that list can explain why one tool started behaving differently."
  - term: "BUS"
    expansion: "event bus"
    plainDefinition: "The single path that carries telemetry, commands, alerts, tickets, and approvals."
    whyItMatters: "One path is what lets a trace walk from a fault command to the corrective action it caused."
  - term: "C"
    expansion: "degrees Celsius"
    plainDefinition: "The temperature unit used on the tool sensors."
    whyItMatters: "A few degrees of chuck or bath temperature can change etch depth, film thickness, or cleaning."
  - term: "CAL"
    expansion: "calibration record"
    plainDefinition: "The id prefix on a record that says when an instrument was last checked."
    whyItMatters: "An overdue calibration means the number on the screen may not match the real flow or pressure."
  - term: "CAPA"
    expansion: "corrective and preventive action"
    plainDefinition: "The formal record of what will be fixed and how the fix will be checked."
    whyItMatters: "Creating one is a real quality-system write, so a person must approve it first."
  - term: "Capability"
    expansion: "what a plant can do"
    plainDefinition: "A kind of work a site is set up for, such as manufacturing, warehousing, research, sales, or the back office."
    whyItMatters: "The plant model lists every capability. Only manufacturing is simulated in this demo."
  - term: "CDC"
    expansion: "change data capture"
    plainDefinition: "A way to copy updates out of a source system as they happen."
    whyItMatters: "It is how a production pipeline would keep the evidence store current."
  - term: "CF4"
    expansion: "carbon tetrafluoride"
    plainDefinition: "A fluorine gas used in the oxide etch."
    whyItMatters: "Its flow helps set how fast the etch removes material."
  - term: "CFG"
    expansion: "configuration record"
    plainDefinition: "The id prefix on the saved hardware and recipe revision for a tool."
    whyItMatters: "The investigation compares this revision with the revision written on the wafer runs."
  - term: "CHF3"
    expansion: "trifluoromethane"
    plainDefinition: "A fluorine gas used with CF4 in the oxide etch."
    whyItMatters: "The mix of the two gases changes the etch rate and the shape of the cut."
  - term: "CI"
    expansion: "continuous integration"
    plainDefinition: "The automated build and test that runs when code is proposed."
    whyItMatters: "A change that breaks the build or the tests does not get merged."
  - term: "CLI"
    expansion: "command-line interface"
    plainDefinition: "A program you run by typing a command, such as the data generator."
    whyItMatters: "The seed, the documents, and the search index are rebuilt from commands, not by hand."
  - term: "CLN"
    expansion: "clean work order"
    plainDefinition: "The id prefix on a chamber-clean maintenance job."
    whyItMatters: "The hours since that clean are the clock for a slow wear-out."
  - term: "CMMS"
    expansion: "computerized maintenance management system"
    plainDefinition: "The system that holds preventive maintenance, calibrations, and work orders."
    whyItMatters: "An overdue calibration or a recent clean is evidence for or against an equipment cause."
  - term: "CoA"
    expansion: "certificate of analysis"
    plainDefinition: "The supplier's sheet that says what was measured on a material lot."
    whyItMatters: "It is the document that can confirm a gas or chemical lot was out of spec."
  - term: "control limits"
    expansion: "centre plus or minus three sigma"
    plainDefinition: "The edges of the normal band on a control chart. They are the recipe window's center plus or minus three standard deviations, then clamped to the sensor's physical range. They follow the recipe step of each reading. They are not calculated from the readings on the chart."
    whyItMatters: "A reading past them, or a pattern inside them, is statistically unusual even when it is still inside the recipe spec. During a fault the band keeps following the recipe step."
  - term: "COPQ"
    expansion: "cost of poor quality"
    plainDefinition: "The money lost to scrap, rework, warranty, downtime, and investigation time."
    whyItMatters: "It is the baseline the savings estimate is measured against."
  - term: "count"
    expansion: "count"
    plainDefinition: "A number of items, such as added particles or residue spots."
    whyItMatters: "These counts are the wafer result the particle and residue limits are written in."
  - term: "Counter"
    expansion: "cumulative count"
    plainDefinition: "A value that only goes up, such as RF-hours or wafers run."
    whyItMatters: "It is charted but has no control limits, because a rising count is normal, not a fault."
  - term: "Cpk"
    expansion: "process capability index"
    plainDefinition: "A single number for how comfortably a process sits inside its limits."
    whyItMatters: "A low value means the process is close to making bad wafers even when it looks steady."
  - term: "CSS"
    expansion: "Cascading Style Sheets"
    plainDefinition: "The rules that set colors, type, and layout in the console."
    whyItMatters: "They keep the fab screen consistent so status colors mean the same thing everywhere."
  - term: "CSV"
    expansion: "comma-separated values"
    plainDefinition: "A plain table file that a spreadsheet can open."
    whyItMatters: "The ROI numbers are stored this way so the deck and the screen use the same figures."
  - term: "CTO"
    expansion: "chief technology officer"
    plainDefinition: "The technology leader the pitch is prepared for."
    whyItMatters: "The story is aimed at a decision maker, not only at a process engineer."
  - term: "DIW"
    expansion: "deionized water"
    plainDefinition: "Very pure water used to rinse a wafer."
    whyItMatters: "The rinse flow has to be high enough to carry chemicals off the wafer."
  - term: "DPIA"
    expansion: "data protection impact assessment"
    plainDefinition: "A review of how people's data would be handled before a real deployment."
    whyItMatters: "It is one of the gates that must pass before the pilot leaves shadow mode."
  - term: "DRF"
    expansion: "process-drift eval case"
    plainDefinition: "The id prefix on an eval case about a process that moved with no released change."
    whyItMatters: "The case has to name that class, including a recipe edit that has no engineering change order."
  - term: "E2E"
    expansion: "end to end"
    plainDefinition: "A test that walks a whole path, from the first event to the last screen."
    whyItMatters: "It is the check that the demo story still completes after the pieces are joined."
  - term: "EC"
    expansion: "engineering change"
    plainDefinition: "A released change to a part, a drawing, or a recipe."
    whyItMatters: "A change that took effect just before a shift is a direct reason the tool started behaving differently."
  - term: "ECN"
    expansion: "engineering change notice"
    plainDefinition: "The notice that tells the factory an engineering change has been released."
    whyItMatters: "It is the paper trail that links a new part revision to the moment the signal moved."
  - term: "ECO"
    expansion: "engineering change order"
    plainDefinition: "The approved order that releases an engineering change."
    whyItMatters: "Citing the order shows the change was real and when it became effective. A recipe edit with no order is process drift, not this change."
  - term: "edge ring"
    expansion: "wafer-edge process ring"
    plainDefinition: "The ring around the wafer that shapes the process at the wafer edge."
    whyItMatters: "A new revision of this ring can change the etch even when the recipe setpoints stay the same."
  - term: "ERP"
    expansion: "enterprise resource planning"
    plainDefinition: "The system that holds material lots, suppliers, and receiving records."
    whyItMatters: "A new lot received just before a multi-tool shift points at the material, not at one chamber."
  - term: "ESC"
    expansion: "electrostatic chuck"
    plainDefinition: "The plate that holds the wafer and controls its temperature during etch."
    whyItMatters: "If this temperature swings, the etch depth can change even though the recipe setpoints did not."
  - term: "ET"
    expansion: "Eastern Time"
    plainDefinition: "The clock in New York, including daylight time."
    whyItMatters: "Join links and members show their times in this zone."
  - term: "Fab"
    expansion: "fabrication plant"
    plainDefinition: "A plant that runs wafers through deposition, etch, strip, or clean."
    whyItMatters: "The same tool family can sit in two fabs and still behave differently."
  - term: "FDC"
    expansion: "fault detection and classification"
    plainDefinition: "Software that notices a bad sensor pattern and suggests what kind of fault it is."
    whyItMatters: "It is the factory name for the detection step this demo starts with SPC rules."
  - term: "First-pass yield"
    expansion: "wafers that passed the first time"
    plainDefinition: "The percent of wafers that met the requirement without being reworked."
    whyItMatters: "A rework can hide in a raw output count. This number does not hide it."
  - term: "FLT"
    expansion: "fault"
    plainDefinition: "The id prefix on a scripted problem in the fault catalog."
    whyItMatters: "Each scripted problem has a known cause so the demo can be scored."
  - term: "FMEA"
    expansion: "failure modes and effects analysis"
    plainDefinition: "A document that lists how a tool can fail and what that failure does to the wafer."
    whyItMatters: "It tells the investigation which sensor movement is already known to hurt the product."
  - term: "foreline pump"
    expansion: "chamber vacuum pump"
    plainDefinition: "The vacuum pump that pulls process gas out of the chamber."
    whyItMatters: "A worn bearing in this pump raises vibration and can disturb the process."
  - term: "FWD"
    expansion: "forward"
    plainDefinition: "The sensor-id code for power sent into the chamber."
    whyItMatters: "Forward power is the energy the recipe asked for. Reflected power is the part that bounced back."
  - term: "GA"
    expansion: "general availability"
    plainDefinition: "The point at which a product is released for ordinary use."
    whyItMatters: "The plan records whether the agent framework is still pre-release on build day."
  - term: "GB"
    expansion: "Grok Build lane"
    plainDefinition: "One of the parallel build lanes in this project. GB-1 is data and simulation."
    whyItMatters: "It tells a reviewer which person owns a folder so the lanes do not overwrite each other."
  - term: "H2"
    expansion: "hydrogen"
    plainDefinition: "A gas used with nitrogen in the strip recipe."
    whyItMatters: "The mix changes how fast photoresist is removed."
  - term: "HMAC"
    expansion: "hash-based message authentication code"
    plainDefinition: "A signature that proves an approval token was issued by this system and has not been edited."
    whyItMatters: "A write without a valid signature is rejected, so the model cannot approve itself."
  - term: "HTML"
    expansion: "HyperText Markup Language"
    plainDefinition: "The page format used for the clickable wireframes."
    whyItMatters: "The wireframes are the picture the console is built to match."
  - term: "HTTP"
    expansion: "HyperText Transfer Protocol"
    plainDefinition: "The ordinary web request format the API and the mock systems speak."
    whyItMatters: "Faults such as a server error or a timeout are injected on these requests."
  - term: "ID"
    expansion: "identifier"
    plainDefinition: "The stable name of a tool, a lot, a ticket, or a piece of evidence."
    whyItMatters: "Every claim in an investigation has to point at one of these names."
  - term: "INJ"
    expansion: "prompt-injection eval case"
    plainDefinition: "The id prefix on an eval case that plants an instruction in a document or an operator note."
    whyItMatters: "The case must ignore that instruction and still name the process-drift cause the records support."
  - term: "INV"
    expansion: "investigation"
    plainDefinition: "The stage where evidence is gathered and a cause is proposed or the case is escalated."
    whyItMatters: "This is the stage a manager reads before deciding whether to approve a fix."
  - term: "IoT"
    expansion: "internet of things"
    plainDefinition: "Sensors on the tool that publish measurements on their own."
    whyItMatters: "This is the channel for an alarm a chart raised, as opposed to a person typing a report."
  - term: "IP"
    expansion: "intellectual property"
    plainDefinition: "Ownership of the design, the code, and the documents in this repository."
    whyItMatters: "The pitch states who owns the work and that the companies in it are fictional."
  - term: "JS"
    expansion: "JavaScript"
    plainDefinition: "The language of the console and of the browser mocks."
    whyItMatters: "The screen is a separate program from the .NET API and talks to it over the contract."
  - term: "JSON"
    expansion: "JavaScript Object Notation"
    plainDefinition: "The text format used for API payloads, events, and the search index."
    whyItMatters: "Agents and tests can check the shape of a result because it is structured text, not a paragraph."
  - term: "JSX"
    expansion: "JavaScript XML"
    plainDefinition: "The way the web console's screens are written, mixing page layout with code."
    whyItMatters: "It is a developer term only; operators never see it."
  - term: "KPI"
    expansion: "key performance indicator"
    plainDefinition: "A measured result such as run rate, uptime, yield, or time between failures."
    whyItMatters: "These are the numbers a supervisor compares across tools without reading a sensor trace."
  - term: "kW"
    expansion: "kilowatt"
    plainDefinition: "One thousand watts. Etch source power and strip plasma power are often spoken of this way."
    whyItMatters: "The screen shows watts so a 1.6 kW source and a 350 W bias are not mixed up."
  - term: "L/min"
    expansion: "liters per minute"
    plainDefinition: "The flow unit for the clean-tool chemicals and rinse water."
    whyItMatters: "Too little flow leaves chemical or residue on the wafer."
  - term: "LCL"
    expansion: "lower control limit"
    plainDefinition: "The bottom line of the normal band on a control chart."
    whyItMatters: "A point below this line is a signal, not ordinary wobble."
  - term: "LED"
    expansion: "light-emitting diode"
    plainDefinition: "The status lamp on a tool tile. Cyan is normal, amber is a warning, and red is an alarm."
    whyItMatters: "A glance at the lamp tells a supervisor which tool needs attention."
  - term: "LLM"
    expansion: "large language model"
    plainDefinition: "The kind of model that reads the evidence pack and drafts a cause."
    whyItMatters: "Its draft is checked against citations and still needs a human approval."
  - term: "LTS"
    expansion: "long-term support"
    plainDefinition: "A release that is maintained for years. This demo uses .NET 10."
    whyItMatters: "It is the supported runtime a reviewer can install and run."
  - term: "MAF"
    expansion: "Microsoft Agent Framework"
    plainDefinition: "The .NET library that runs the investigation as a graph of steps with a human pause."
    whyItMatters: "The workflow can stop for approval and resume without a second programming language."
  - term: "Manual reading"
    expansion: "bench instrument reading"
    plainDefinition: "A value an engineer measured with a bench instrument and uploaded from a printout."
    whyItMatters: "It enters the same series and rules as the sensor, so it raises an alert only if it breaks a limit."
  - term: "MCP"
    expansion: "Model Context Protocol"
    plainDefinition: "A standard way for an outside agent to call the same read-only tools."
    whyItMatters: "It is the stretch path that would let another orchestrator use this evidence without a rewrite."
  - term: "MEAI"
    expansion: "Microsoft.Extensions.AI"
    plainDefinition: "The shared .NET interface the demo uses to call a model."
    whyItMatters: "Offline saved answers, a live model call, and failover to saved answers all sit behind one interface, so the rest of the code does not care which one is on."
  - term: "MEG"
    expansion: "megasonic"
    plainDefinition: "The sensor-id code for the high-frequency sound power in the clean bath."
    whyItMatters: "That power shakes particles off the wafer. The clean tools do not use an RF generator."
  - term: "MES"
    expansion: "manufacturing execution system"
    plainDefinition: "The system that records which recipe, revision, and lot actually ran."
    whyItMatters: "If this revision disagrees with the drawing, the investigation must stop and ask which one is real."
  - term: "MFC"
    expansion: "mass flow controller"
    plainDefinition: "The instrument that meters gas or chemical into the chamber."
    whyItMatters: "An overdue controller can report a flow that is not the flow the wafer received."
  - term: "MIS"
    expansion: "missing-evidence eval case"
    plainDefinition: "The id prefix on an eval case that lacks the evidence to name a cause."
    whyItMatters: "The case has to escalate, and it must not assert a category."
  - term: "MIT"
    expansion: "MIT License"
    plainDefinition: "The open-source license on this repository. It grants use and does not transfer ownership."
    whyItMatters: "A reviewer can read and run the demo, and the intellectual property stays with its owner."
  - term: "mm"
    expansion: "millimeter"
    plainDefinition: "The length unit for wafer position, edge-ring height, and chuck runout."
    whyItMatters: "A tenth of a millimeter of offset is enough to change the edge of the wafer."
  - term: "mm/s"
    expansion: "millimeters per second"
    plainDefinition: "The unit for vibration intensity."
    whyItMatters: "The pump and robot limits are written in this unit."
  - term: "MPS"
    expansion: "Meridian Precision Systems"
    plainDefinition: "The fictional equipment maker this demo is built for."
    whyItMatters: "Every tool name and lot in the story belongs to this fictional customer."
  - term: "MQTT"
    expansion: "Message Queuing Telemetry Transport"
    plainDefinition: "A lightweight publish-and-subscribe protocol for sensor streams."
    whyItMatters: "It is the stretch option for moving telemetry when the demo is not using the in-process stream."
  - term: "MSW"
    expansion: "Mock Service Worker"
    plainDefinition: "The browser stand-in that answers API calls before the real API is connected."
    whyItMatters: "The console can be clicked through on fake data that still matches the contract."
  - term: "MTBF"
    expansion: "mean time between failures"
    plainDefinition: "The average running time between breakdowns."
    whyItMatters: "A short interval means the tool is failing often, which is a reliability problem even if today's yield looks fine."
  - term: "mTorr"
    expansion: "millitorr"
    plainDefinition: "One thousandth of a torr. Etch chambers run in this range."
    whyItMatters: "Etch pressure is a vacuum measurement. It is not comparable to deposition pressure in torr."
  - term: "MTTR"
    expansion: "mean time to repair"
    plainDefinition: "The average time to get a tool back after it stops. In the quality story, MTTR-Q is the time to resolve an incident."
    whyItMatters: "Shorter repair and investigation time is the downtime and labor the business case is trying to recover."
  - term: "MTTR-Q"
    expansion: "mean time to resolve a quality incident"
    plainDefinition: "The average time from a quality incident opening until the fix is in place."
    whyItMatters: "This is the investigation clock in the business case, separate from how long a mechanic takes to repair a tool."
  - term: "N2"
    expansion: "nitrogen"
    plainDefinition: "An inert gas used with hydrogen in the strip recipe."
    whyItMatters: "It is part of the gas mix the strip tool depends on."
  - term: "N2H2"
    expansion: "nitrogen-hydrogen mix"
    plainDefinition: "The forming-gas mix used on the strip tool."
    whyItMatters: "A bad mix changes the ash rate the same way a bad oxygen flow does."
  - term: "N2O"
    expansion: "nitrous oxide"
    plainDefinition: "An oxidizer gas used in deposition."
    whyItMatters: "Its flow helps set the film that grows on the wafer."
  - term: "NCR"
    expansion: "nonconformance report"
    plainDefinition: "A quality record that says something was found out of spec."
    whyItMatters: "It is one of the ways a problem enters the same investigation path as a sensor alert."
  - term: "misleading records (to rule out)"
    expansion: "confounders"
    plainDefinition: "Business records written with an injected fault that look related but are not the cause, such as a maintenance visit the same week, a paperwork-only change on one tool, or a routine supplier lot change. They never change sensor readings and never raise alerts or tickets."
    whyItMatters: "A good investigation checks them and lists them as ruled out instead of blaming them."
  - term: "ruled out"
    expansion: "considered and dismissed"
    plainDefinition: "A record the investigation looked at and decided is not the cause. The reason is one short sentence from the record or from the AI."
    whyItMatters: "The record stays visible so a reviewer can see it was checked, and it is not listed as support for the cause."
  - term: "considered and ruled out"
    expansion: "checked and dismissed"
    plainDefinition: "The group of records the plant data or the AI looked at and set aside, each with a reason."
    whyItMatters: "A reviewer can see what was considered and why it was not the cause."
  - term: "candidate record"
    expansion: "a record that can support a class"
    plainDefinition: "A record in the pack that may support one root-cause class. A ruled-out record is not a candidate."
    whyItMatters: "The recommendation cites candidate records that support the class it chose."
  - term: "evidence handle"
    expansion: "a short evidence id"
    plainDefinition: "A short id such as E01 that stands in for a long evidence id when the model reads the pack. The server maps it back to the real id before the answer is checked."
    whyItMatters: "Short handles keep the model from copying a long id wrong."
  - term: "out of control"
    expansion: "statistically unusual"
    plainDefinition: "A reading or pattern that broke a control rule. It can still be inside the recipe spec."
    whyItMatters: "It warns early that something changed, before wafers go out of spec. Shown in amber."
  - term: "out of spec"
    expansion: "outside the recipe spec"
    plainDefinition: "A reading below the recipe minimum or above the recipe maximum for the step that was running."
    whyItMatters: "Wafers processed out of spec can be scrapped. Shown in red."
  - term: "recipe spec"
    expansion: "recipe minimum and maximum"
    plainDefinition: "The allowed range for a parameter in the recipe step that was running, read from the recipe data."
    whyItMatters: "It is the line between a good and a suspect wafer; it changes from step to step."
  - term: "recipe step"
    expansion: "one stage of a recipe"
    plainDefinition: "One stage of the recipe a tool runs, such as Stabilize, Main etch or Endpoint. Each step sets its own center and limits for every parameter. The SPC chart draws the limits of the step each reading was taken in."
    whyItMatters: "A reading that is normal in one step can be abnormal in the next, so the limits change at every step boundary. A load-time check refuses a step that skips a parameter. A tool runs its recipes one after another, so the chart names the recipe where it changes."
  - term: "recipe window"
    expansion: "stepped control limits"
    plainDefinition: "The center and the allowed range for one parameter on one recipe step. Control limits are that center plus or minus three standard deviations of the window, then clamped to the sensor's physical range. They come from the step that was running, not from the statistics of the readings on the chart."
    whyItMatters: "During a fault the band keeps following the recipe step. It does not re-center on the bad data."
  - term: "idle window"
    expansion: "limits for a parameter a step does not set"
    plainDefinition: "A real center and range written on a recipe step for a parameter that step does not actively control. Every step defines every parameter this way. A load-time check refuses a step that leaves one out. Nothing falls back to another step's window."
    whyItMatters: "The chart and the rules always have limits, including in a step that is not using that knob."
  - term: "physical range"
    expansion: "what the sensor can read"
    plainDefinition: "The floor and ceiling of a sensor: its minimum and maximum in the fleet data. They match the family envelope. Control limits are clamped to this range on the server, on the chart, and in the rule score."
    whyItMatters: "A flow or a power never gets a negative limit, and a reading the sensor cannot produce scores as critical."
  - term: "telemetry window"
    expansion: "the readings the chart keeps"
    plainDefinition: "The newest 600 readings kept for each sensor, in memory and in the database. Older readings roll off. The chart's horizontal axis is always this wide."
    whyItMatters: "New readings enter on the right and old ones leave on the left. A reset fills this window in memory and does not load a week of history onto the bus. A soft reset keeps the readings already stored in the database."
  - term: "model mode"
    expansion: "which model answers the agents"
    plainDefinition: "The one setting Mps:Model:Mode, also spelled MODEL_MODE. offline uses saved answers, costs nothing, and does not use the network. openai calls OpenAI with a key. azure calls Azure OpenAI, with a managed identity, an Azure login, or a key. Blank means openai when a key is set, and offline otherwise. LLM_MODE is only an old alias."
    whyItMatters: "A live call waits at most 20 seconds and is not retried by the client. If it fails, the gateway answers from saved answers and the console says so."
  - term: "rejected answer"
    expansion: "the AI draft a guard refused"
    plainDefinition: "The cause, class, and cited evidence ids the model proposed when a guard refused the answer and the case was escalated. It is saved on the investigation and shown as what the AI proposed and was not accepted."
    whyItMatters: "A person can see the draft that failed the check without treating it as the finding."
  - term: "process drift"
    expansion: "a process that moved with no released change"
    plainDefinition: "A slow change in the wafer result with no new part, lot, or calibration. A recipe setpoint edited with no engineering change order is this class, not an engineering change."
    whyItMatters: "That work-order wording maps to process drift, and the evidence gate counts the record as enough to separate the causes."
  - term: "linked records"
    expansion: "tickets, alerts, investigations, and manual readings on one tool"
    plainDefinition: "The tickets, alerts, investigations, and manual readings that belong to one tool, listed together. While a round is gathering, the list shows a Started placeholder. When the saved investigation arrives, that one entry replaces the placeholder."
    whyItMatters: "The list does not show Started next to the finished stage for the same investigation."
  - term: "silane"
    expansion: "silane gas (SiH4)"
    plainDefinition: "A silicon-bearing process gas used to deposit thin films on wafers."
    whyItMatters: "A bad silane lot can shift film thickness on every tool that uses it."
  - term: "supplier notice"
    expansion: "supplier quality notice"
    plainDefinition: "A message from a material supplier about a lot they shipped, for example that it was out of spec or that a routine change was made."
    whyItMatters: "It can point to a shared material cause, or rule one out when the lot is inside its spec. Notices are looked up only for lots this tool used. A tool with no lots gets none."
  - term: "material lot"
    expansion: "lot of purchased material"
    plainDefinition: "One batch of a gas, chemical or part from a supplier, tracked by a lot number."
    whyItMatters: "When several tools shift together, a shared lot is a likely cause."
  - term: "certificate of analysis"
    expansion: "certificate of analysis (CoA)"
    plainDefinition: "The supplier's test report for a lot, showing it meets the purchase specification."
    whyItMatters: "It shows whether the material itself was in spec."
  - term: "Nelson rules"
    expansion: "Nelson rules for control charts"
    plainDefinition: "A numbered set of checks for a chart of readings over time. Each rule looks for a pattern that is unlikely by chance, such as a long run of rising readings, even when no single reading is out of limits."
    whyItMatters: "They warn about a drifting process early, before parts go out of spec."
  - term: "Nelson rule 6"
    expansion: "Nelson rule 6, rising or falling trend"
    plainDefinition: "A control-chart rule that flags six points in a row, each higher (or each lower) than the one before."
    whyItMatters: "It catches a steady trend, such as chamber seasoning, before any single point crosses a limit."
  - term: "NET"
    expansion: ".NET"
    plainDefinition: "The Microsoft runtime this demo is built on. The version in use is .NET 10."
    whyItMatters: "It is the one runtime a reviewer needs for the API, the simulator, and the tests."
  - term: "NF"
    expansion: "gas-lot series"
    plainDefinition: "The series prefix on the fictional gas lot NF-3317."
    whyItMatters: "That lot is the shared material behind the etch-rate drop on both etch tools."
  - term: "NF3"
    expansion: "nitrogen trifluoride"
    plainDefinition: "A cleaning and etch gas in the fictional NF3/O2 mix."
    whyItMatters: "Moisture in that mix can slow the etch on every tool that used the lot."
  - term: "NH3"
    expansion: "ammonia"
    plainDefinition: "A gas used when depositing nitride."
    whyItMatters: "Its flow is part of the recipe that sets the nitride film."
  - term: "nm"
    expansion: "nanometer"
    plainDefinition: "A billionth of a meter. Film thickness is measured in nanometers."
    whyItMatters: "The film spec is a band of tens of nanometers, so a small drift is a real miss."
  - term: "nm/min"
    expansion: "nanometers per minute"
    plainDefinition: "The speed of etch or ash, as thickness removed each minute."
    whyItMatters: "A slower rate means the wafer may come out under-processed."
  - term: "O2"
    expansion: "oxygen"
    plainDefinition: "The gas used to ash photoresist and as an additive in etch."
    whyItMatters: "A wrong oxygen flow strips too fast, too slow, or changes the etch chemistry."
  - term: "OEE"
    expansion: "overall equipment effectiveness"
    plainDefinition: "Availability times speed times good-wafer rate, expressed as a percent of a perfect hour."
    whyItMatters: "It rolls uptime, run rate, and yield into one number a manager can compare across tools."
  - term: "OIDC"
    expansion: "OpenID Connect"
    plainDefinition: "The sign-in protocol the deployment workflow uses with GitHub."
    whyItMatters: "The deployment can prove who it is without a stored password."
  - term: "OSC"
    expansion: "signal-shape eval case"
    plainDefinition: "The id prefix on an eval case whose trace is an oscillation."
    whyItMatters: "The case has to escalate, and it must not describe the oscillation as a drift."
  - term: "OSS"
    expansion: "open-source software"
    plainDefinition: "Software whose license lets you read, use, and change it."
    whyItMatters: "The agent framework, the search pieces, and this demo are available that way."
  - term: "OTLP"
    expansion: "OpenTelemetry Protocol"
    plainDefinition: "The standard way traces and metrics are exported."
    whyItMatters: "The same investigation timing can be viewed locally or in a hosted monitor."
  - term: "OUT"
    expansion: "output"
    plainDefinition: "The sensor-id code for a result such as etch rate, film thickness, or particles."
    whyItMatters: "These are the measurements that say whether the wafer came out right, not just whether the knobs were set."
  - term: "OWASP"
    expansion: "Open Worldwide Application Security Project"
    plainDefinition: "The group whose Zed Attack Proxy scan is used as a security check."
    whyItMatters: "A high finding from that scan blocks the demo from being called secure."
  - term: "PDF"
    expansion: "Portable Document Format"
    plainDefinition: "The fixed-page format used for printed diagrams."
    whyItMatters: "Reviewers can read the architecture pictures without the source tools."
  - term: "PECVD"
    expansion: "plasma-enhanced chemical vapor deposition"
    plainDefinition: "The deposition method that grows a film from gases with the help of a plasma."
    whyItMatters: "It is the process family behind the MPS-D7 tools and their gas and temperature sensors."
  - term: "percent"
    expansion: "percent"
    plainDefinition: "A share of a whole, used for uniformity, yield, uptime, and OEE."
    whyItMatters: "These are the numbers a manager compares without converting units."
  - term: "PII"
    expansion: "personally identifiable information"
    plainDefinition: "Data that can identify a real person."
    whyItMatters: "This demo uses none. A production system would have to protect it."
  - term: "Pilot line"
    expansion: "research line"
    plainDefinition: "A small line used to try a process before it runs on the main fabs."
    whyItMatters: "Lumen Pilot Works runs strip, clean, and a short research line, separate from the two front-end fabs."
  - term: "PL"
    expansion: "process lot"
    plainDefinition: "The id prefix on a bottled process-gas lot."
    whyItMatters: "The same lot id on two tools means both tools drew from one bottle."
  - term: "PLM"
    expansion: "product lifecycle management"
    plainDefinition: "The system that holds drawings, part revisions, and engineering change orders."
    whyItMatters: "It is where an investigation checks whether a new part revision was released before the signal moved."
  - term: "PM"
    expansion: "preventive maintenance"
    plainDefinition: "Planned work done on a tool to keep it healthy, such as a chamber service."
    whyItMatters: "A visit in the same week can look like the cause when the real cause is a change order or a worn part."
  - term: "PNG"
    expansion: "Portable Network Graphics"
    plainDefinition: "An image format used for exported pictures."
    whyItMatters: "Screenshots in this format can go into the pitch deck without being redrawn."
  - term: "POV"
    expansion: "point of view"
    plainDefinition: "The short executive story at the front of the pitch."
    whyItMatters: "It is the part a manager can retell without opening the console."
  - term: "PPTX"
    expansion: "PowerPoint presentation"
    plainDefinition: "The slide file used for the pitch deck."
    whyItMatters: "The deck is a deliverable alongside the running demo."
  - term: "PR"
    expansion: "pull request"
    plainDefinition: "A proposed code change that waits for review and for the automated checks."
    whyItMatters: "Lane work lands only after those checks and an architect review."
  - term: "precursor"
    expansion: "film-forming material"
    plainDefinition: "The material that becomes the deposited film."
    whyItMatters: "A thin precursor lot lowers film thickness on every tool that used that lot."
  - term: "Production line"
    expansion: "ordered process steps"
    plainDefinition: "The order a wafer follows through a manufacturing capability, such as photoresist strip, clean, thin-film deposition, and etch."
    whyItMatters: "The floor shows where the tools sit. The production line shows the process order, which can differ from the bay layout."
  - term: "PT"
    expansion: "pressure transducer"
    plainDefinition: "The sensor-id code for the chamber pressure gauge."
    whyItMatters: "Pressure sets the plasma and the film. A gauge that was not calibrated can lie."
  - term: "PVD"
    expansion: "physical vapor deposition"
    plainDefinition: "A deposition method that coats a wafer from a solid source rather than from a chemical gas."
    whyItMatters: "It is the other deposition method in this fictional product line, alongside PECVD."
  - term: "PWR"
    expansion: "power"
    plainDefinition: "The sensor-id code for megasonic power on a clean tool."
    whyItMatters: "That power is what shakes particles loose in the bath."
  - term: "QA"
    expansion: "quality assurance"
    plainDefinition: "The function that decides whether a process and its records are acceptable."
    whyItMatters: "The QA manager is one of the people who has to understand the evidence without being the process engineer."
  - term: "QMS"
    expansion: "quality management system"
    plainDefinition: "The system that holds nonconformance reports and corrective actions."
    whyItMatters: "The approved fix is written here, and nowhere else, after a person approves it."
  - term: "RAG"
    expansion: "retrieval-augmented generation"
    plainDefinition: "Answering from retrieved documents instead of from the model's memory alone."
    whyItMatters: "The investigation has to cite a procedure or a bulletin, not invent one."
  - term: "RBAC"
    expansion: "role-based access control"
    plainDefinition: "Permissions granted by job role, such as plant and document access."
    whyItMatters: "In production a person would see only the plants and documents their role allows."
  - term: "RC"
    expansion: "release candidate"
    plainDefinition: "A build that is proposed as final and still being confirmed."
    whyItMatters: "The plan says to confirm the agent framework's release status on build day."
  - term: "RF"
    expansion: "radio frequency"
    plainDefinition: "The electrical energy that lights and sustains the plasma."
    whyItMatters: "Forward power does the work. Reflected power is energy that bounced back and can mean a mismatch."
  - term: "RFL"
    expansion: "reflected"
    plainDefinition: "The sensor-id code for RF power that bounced back toward the generator."
    whyItMatters: "A rising reflected share means energy is not reaching the wafer."
  - term: "RMS"
    expansion: "root mean square"
    plainDefinition: "A way to summarize vibration as one positive number."
    whyItMatters: "The pump and robot limit is written in this form, so the schematic uses it too."
  - term: "RNG"
    expansion: "random number generator"
    plainDefinition: "The seeded source of the small wobble on each simulated sensor."
    whyItMatters: "The same seed always redraws the same trace, so a demo and a test can agree."
  - term: "ROI"
    expansion: "return on investment"
    plainDefinition: "The comparison of expected savings with the cost to run the system."
    whyItMatters: "It is the business page of the demo, and every figure on it is labeled illustrative."
  - term: "Run rate"
    expansion: "wafers finished per hour"
    plainDefinition: "How many wafers the tool finishes in an hour while it is running."
    whyItMatters: "A drop means the tool is slower, even when it has not stopped."
  - term: "s"
    expansion: "second"
    plainDefinition: "The time unit for endpoint time and for the simulator's step clock."
    whyItMatters: "Endpoint time says how long the etch took to finish, which moves when the rate moves."
  - term: "SC"
    expansion: "scripted scenario"
    plainDefinition: "The id prefix on a scripted demo case that is namespaced apart from S1 through S5. SC-5 is the cross-site supply case."
    whyItMatters: "It keeps the new cross-site case from being mistaken for the process-drift case S5."
  - term: "SC1"
    expansion: "Standard Clean 1"
    plainDefinition: "An ammonia and peroxide bath used to remove particles."
    whyItMatters: "Its flow and temperature are the spec for the first clean step."
  - term: "SC2"
    expansion: "Standard Clean 2"
    plainDefinition: "A hydrochloric acid and peroxide bath used to remove metals."
    whyItMatters: "Its flow and temperature are the spec for the metal-removal step."
  - term: "sccm"
    expansion: "standard cubic centimeters per minute"
    plainDefinition: "The gas-flow unit used on deposition, etch, and strip."
    whyItMatters: "The recipe's gas spec is written in this unit, and so is the mass-flow sensor."
  - term: "SDK"
    expansion: "software development kit"
    plainDefinition: "The installed tools needed to build the demo. Here that is the .NET 10 SDK."
    whyItMatters: "A reviewer needs it on the machine before the tests or the API will build."
  - term: "SHA"
    expansion: "Secure Hash Algorithm"
    plainDefinition: "A function that turns text into a short fingerprint."
    whyItMatters: "The demo uses a fingerprint to detect a changed document or a repeated approval."
  - term: "SHA256"
    expansion: "Secure Hash Algorithm 256-bit"
    plainDefinition: "A specific fingerprint function that produces a 256-bit result."
    whyItMatters: "It is long enough that two different records do not look the same."
  - term: "SI"
    expansion: "silicon"
    plainDefinition: "The wafer material code in lot ids such as WAF-SI-300."
    whyItMatters: "It names the wafer lot the runs were started from."
  - term: "SIH4"
    expansion: "silane"
    plainDefinition: "The identifier spelling of silane, the silicon source gas for deposition."
    whyItMatters: "The sensor id uses this spelling so the gas box point matches the recipe gas."
  - term: "SiH4"
    expansion: "silane"
    plainDefinition: "The silicon source gas used to grow oxide and nitride films."
    whyItMatters: "Its flow is one of the knobs that sets how thick the film grows."
  - term: "SLM"
    expansion: "small language model"
    plainDefinition: "A smaller model that can run locally for a narrower task."
    whyItMatters: "It is the stretch path for a site that does not want a frontier model in the loop."
  - term: "SME"
    expansion: "subject-matter expert"
    plainDefinition: "A person who knows the process well enough to judge whether a case is realistic."
    whyItMatters: "The eval set is sampled for that review so the scored cases are not only internally consistent."
  - term: "SN"
    expansion: "supplier notice"
    plainDefinition: "The id prefix on a note from a supplier about a material lot."
    whyItMatters: "The notice is the evidence that the supplier already knew the lot was out of spec."
  - term: "SOP"
    expansion: "standard operating procedure"
    plainDefinition: "The controlled steps for running or servicing a tool."
    whyItMatters: "It is the baseline an investigation compares a drifting tool against."
  - term: "SPC"
    expansion: "statistical process control"
    plainDefinition: "A running check that a measurement is still behaving the way it usually does."
    whyItMatters: "This is what opens a ticket when a sensor leaves its normal pattern, before anyone has to guess why."
  - term: "SPEC"
    expansion: "specification"
    plainDefinition: "The written target for what the product must do and the gates it must pass."
    whyItMatters: "A blank metric means that gate has not been scored yet. It is not a passing score."
  - term: "SQL"
    expansion: "Structured Query Language"
    plainDefinition: "The language of the relational database used for local and hosted storage."
    whyItMatters: "Approvals, traces, and the spend ledger are stored where they can be queried later."
  - term: "SRC"
    expansion: "source"
    plainDefinition: "The sensor-id code for the main RF generator, as opposed to the bias generator."
    whyItMatters: "Source power lights the plasma. Bias power pulls ions toward the wafer. They fail differently."
  - term: "SVG"
    expansion: "Scalable Vector Graphics"
    plainDefinition: "A drawing format that stays sharp at any size. The tool schematic is one of these."
    whyItMatters: "Sensor points on the drawing use the same ids as the live data, so the picture cannot drift from the stream."
  - term: "SWA"
    expansion: "Static Web Apps"
    plainDefinition: "The hosted place the console would be published."
    whyItMatters: "It is the front door an invited reviewer would open."
  - term: "TC"
    expansion: "thermocouple"
    plainDefinition: "The sensor-id code for a temperature probe."
    whyItMatters: "Chuck, wall, heater, and bath temperature each have their own probe and their own limit."
  - term: "TKT"
    expansion: "ticket"
    plainDefinition: "The id prefix on an intake ticket."
    whyItMatters: "The ticket is the single case that alerts, operator notes, and supplier notices join."
  - term: "TLF"
    expansion: "tool-failure eval case"
    plainDefinition: "The id prefix on an eval case where a connector or the quality system fails."
    whyItMatters: "The case has to end in a partial or failed state and must not invent a cause."
  - term: "TODO"
    expansion: "to do"
    plainDefinition: "A marker for work that is noted and not done yet."
    whyItMatters: "It keeps an unfinished note visible instead of looking like a finished decision."
  - term: "Tool status"
    expansion: "worst active alert"
    plainDefinition: "Nominal, watch, or alarm, taken from the most severe alert that is still active on the tool."
    whyItMatters: "Every screen reads this one value, so the tile, the chart and the why panel never disagree."
  - term: "Torr"
    expansion: "torr"
    plainDefinition: "A pressure unit. 760 torr is about one atmosphere."
    whyItMatters: "Deposition and strip run near this range. Etch runs far below it, in millitorr."
  - term: "TPM"
    expansion: "tokens per minute"
    plainDefinition: "The hosted model's throughput quota."
    whyItMatters: "It is a backstop on spend and speed, alongside the daily dollar cap."
  - term: "UCL"
    expansion: "upper control limit"
    plainDefinition: "The top line of the normal band on a control chart."
    whyItMatters: "A point above this line is a signal, not ordinary wobble."
  - term: "UEV"
    expansion: "user-provided-evidence eval case"
    plainDefinition: "The id prefix on an eval case where a person adds a note about what they saw."
    whyItMatters: "The same request ranks process drift without the note, and names the bearing the person wrote down when the note is present."
  - term: "UI"
    expansion: "user interface"
    plainDefinition: "The screens a person clicks, as opposed to the API behind them."
    whyItMatters: "The glossary, the schematic, and the plain metrics are there so a non-engineer can read the case."
  - term: "ULID"
    expansion: "universally unique lexicographically sortable identifier"
    plainDefinition: "An identifier the event bus assigns so events sort by time without a central counter."
    whyItMatters: "The trace and the charts can order a cascade by this id even when two tools publish at once."
  - term: "Uptime"
    expansion: "share of scheduled time the tool was ready"
    plainDefinition: "The percent of scheduled time the tool was up and able to run."
    whyItMatters: "This is availability. It does not say whether the wafers were good."
  - term: "URL"
    expansion: "uniform resource locator"
    plainDefinition: "The address of a page or an API route."
    whyItMatters: "The console and the tests call the same addresses the contract names."
  - term: "USD"
    expansion: "United States dollars"
    plainDefinition: "The currency of the illustrative cost and savings figures."
    whyItMatters: "Every dollar figure in the business case is synthetic and labeled that way."
  - term: "UTC"
    expansion: "Coordinated Universal Time"
    plainDefinition: "The clock the timestamps are written in, without a local timezone."
    whyItMatters: "A change order and a sensor shift can be compared only if they share one clock."
  - term: "UUID"
    expansion: "universally unique identifier"
    plainDefinition: "A long random ID that is practically never repeated, used to label records."
    whyItMatters: "Every piece of evidence has its own ID, so each claim can be traced to the exact record."
  - term: "UX"
    expansion: "user experience"
    plainDefinition: "How the screens explain a case to the person reading them."
    whyItMatters: "The explainability work exists so a supervisor can retell the problem without decoding tags."
  - term: "VIB"
    expansion: "vibration"
    plainDefinition: "The sensor-id code for pump or robot vibration."
    whyItMatters: "A rise can mean a pump or a handler is wearing out before the wafer result moves."
  - term: "W"
    expansion: "watt"
    plainDefinition: "The unit of RF, remote-plasma, and megasonic power."
    whyItMatters: "Power that is outside its window changes the plasma or the clean without a recipe edit."
  - term: "WAF"
    expansion: "wafer"
    plainDefinition: "The material-code prefix on a silicon wafer lot."
    whyItMatters: "It ties a run back to the wafers that were loaded, which is separate from the gas lot."
  - term: "Wafer outs"
    expansion: "wafers that finish"
    plainDefinition: "How many wafers leave a bay or a plant in an hour."
    whyItMatters: "Starts can look healthy while outs fall, which is a yield or uptime problem."
  - term: "Wafer starts"
    expansion: "wafers that enter"
    plainDefinition: "How many wafers enter a bay or a plant in an hour."
    whyItMatters: "It is the input. Outs and yield are what came of those starts."
  - term: "wafers"
    expansion: "wafers"
    plainDefinition: "The count of wafers out of a tool."
    whyItMatters: "It is the output a supervisor means by how much the tool produced."
  - term: "wafers/hour"
    expansion: "wafers per hour"
    plainDefinition: "The run rate and the throughput unit."
    whyItMatters: "It is the plain speed of the tool, before it is combined into OEE."
  - term: "WE"
    expansion: "Western Electric rules"
    plainDefinition: "Standard control-chart rules (from Western Electric's 1956 quality handbook) that flag a real process change: 1 point beyond 3σ; 2 of 3 beyond 2σ on one side; 4 of 5 beyond 1σ on one side; 8 in a row on one side of the average."
    whyItMatters: "They catch a slow drift before it becomes a hard out-of-spec failure."
  - term: "Western Electric rules"
    expansion: "Western Electric rules"
    plainDefinition: "Standard control-chart rules (from Western Electric's 1956 quality handbook) that flag a real process change: 1 point beyond 3σ; 2 of 3 beyond 2σ on one side; 4 of 5 beyond 1σ on one side; 8 in a row on one side of the average."
    whyItMatters: "They catch a slow drift before it becomes a hard out-of-spec failure, and they rarely fire on ordinary noise."
  - term: "WIP"
    expansion: "work in process"
    plainDefinition: "Wafers that have started and have not finished."
    whyItMatters: "A rising pile of unfinished wafers means the line is taking work in faster than it is finishing it."
  - term: "WO"
    expansion: "work order"
    plainDefinition: "The id prefix on a maintenance job."
    whyItMatters: "The investigation uses it to tell a planned visit or a clean from the cause of a shift."
  - term: "YAML"
    expansion: "YAML Ain't Markup Language"
    plainDefinition: "The text format used for the fleet, the faults, and this glossary."
    whyItMatters: "A reviewer can read the sensor list and the fault stories without opening a database."
  - term: "Yield"
    expansion: "good wafers"
    plainDefinition: "The percent of wafers that met the requirement."
    whyItMatters: "A plant can stay up and still ship fewer good wafers. Yield is that gap."
  - term: "ZAP"
    expansion: "Zed Attack Proxy"
    plainDefinition: "The OWASP scanner that looks for common web weaknesses."
    whyItMatters: "A high finding from it stops the security gate."
  - term: "°C"
    expansion: "degrees Celsius"
    plainDefinition: "The temperature unit, written with the degree sign."
    whyItMatters: "A few degrees on the chuck, the wall, or the bath can change the wafer result."
