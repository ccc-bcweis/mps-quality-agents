# Investigation settings, loaded at startup.
# When the readings do not show a shape yet (too soon after onset), the investigation re-reads the signal this many
# times, this many seconds apart, before it hands the pack to the resolution agent. 0 attempts turns waiting off.
shapeWait:
  attempts: 30
  delaySeconds: 20
