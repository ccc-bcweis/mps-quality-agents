# Investigation settings, loaded at startup.
# The investigation re-reads the signal and its rule breaks until the shape is clear and at least
# minReadingsSinceOnset readings have arrived since the first rule break (20 readings at 15 s = 5 minutes,
# about two cycles of an injected oscillation), trying this many times, this many seconds apart.
# If the shape is still unclear after maxReadingsSinceOnset readings, triage goes on with "no clear shape"
# rather than waiting out every attempt (180 readings = 3 minutes at 10x; at 1x the attempts run out first). 0 turns the cap off.
# 0 attempts turns waiting off.
shapeWait:
  attempts: 30
  delaySeconds: 20
  minReadingsSinceOnset: 20
  maxReadingsSinceOnset: 180
# Evidence loop: a person can add evidence to a round and the agents run again (round 2, 3 ...).
# max is the most rounds one ticket can have; at the last round only approve, override or reject remain.
evidenceRounds:
  max: 5
# The signal-shape classifier. Shares are of the trace range; a noisy step must move the mean by noisyStepSigmas noise
# sigmas, explain the trace clearly better than a line (noisyStepFitShare), keep each side flat (noisyStepSideDrift),
# have noisyStepMinSide readings per side, and cross quickly (at most noisyStepEdgeReadings in between after smoothing).
shapeClassifier:
  stepShare: 0.7
  flatShare: 0.2
  rampShare: 0.5
  sameDirectionShare: 0.75
  noisyStepSigmas: 3
  noisyStepFitShare: 0.6
  noisyStepSideDrift: 0.25
  noisyStepMinSide: 6
  noisyStepSmoothing: 5
  noisyStepEdgeReadings: 10
# Model call budget: a resolution reply that is not JSON is retried up to maxModelCalls calls; an answer whose shape or
# category disagrees with the evidence is asked again shapeRetries times before the case escalates.
resolution:
  maxModelCalls: 2
  shapeRetries: 1
