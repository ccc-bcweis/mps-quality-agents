# Investigation settings, loaded at startup.
# Shape wait: re-read the signal until the shape is clear and at least minReadingsSinceOnset readings have
# arrived since the incident opened. If there is no incident time, onset is the first serious rule break.
# It tries attempts times, delaySeconds apart. Once maxReadingsSinceOnset readings have arrived and the shape
# is still unclear, triage goes on with no clear shape instead of using every attempt.
# 0 attempts turns waiting off. 0 on maxReadingsSinceOnset turns that cap off.
shapeWait:
  attempts: 30
  delaySeconds: 20
  minReadingsSinceOnset: 20
  maxReadingsSinceOnset: 180
# Evidence loop: a person can add evidence to a round and the agents run again (round 2, 3, ...).
# max is the most rounds one ticket can have; at the last round only approve, override, or reject remain.
# The round number is Investigations.Sequence. While a round gathers, linked records show one Started placeholder.
# The saved investigation replaces that placeholder, so the list keeps one entry for the round.
evidenceRounds:
  max: 5
# The signal-shape classifier. Shares are of the trace range; a noisy step must move the mean by noisyStepSigmas noise
# sigmas, explain the trace clearly better than a line (noisyStepFitShare), keep each side flat (noisyStepSideDrift),
# have noisyStepMinSide readings per side, and cross quickly (at most noisyStepEdgeReadings in between after smoothing).
shapeClassifier:
  stepShare: 0.7
  flatShare: 0.2
  rampShare: 0.5
  sameDirectionShare: 0.75
  noisyStepSigmas: 3
  noisyStepFitShare: 0.6
  noisyStepSideDrift: 0.25
  noisyStepMinSide: 6
  noisyStepSmoothing: 5
  noisyStepEdgeReadings: 10
# CauseGuard distinguishes a mention from a citation. A ruled-out record may be mentioned to dismiss a rival
# (by class, not by putting its id in evidenceIds). That record fails the guard when it is cited as support
# (evidenceIds) or named as the cause of its own class. A citation miss is not retried.
# A shape or category miss is asked again shapeRetries times, then the case escalates.
# On escalation the refused answer is saved (Investigations.RejectedAnswerJson; API field rejectedAnswer).
# Model call budget: a resolution reply that is not JSON is retried up to maxModelCalls calls.
resolution:
  maxModelCalls: 2
  shapeRetries: 1
