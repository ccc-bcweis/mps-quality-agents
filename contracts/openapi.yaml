openapi: 3.0.3
info:
  title: Meridian Precision Systems Quality API
  version: 1.3.0
  description: |
    Console API for the fictional Meridian Precision Systems quality-investigation demo.
    Every intake channel becomes one incident. A CAPA is created only after a human approval,
    and the server issues the approval token. Clients do not send token signatures.
    The fleet stream is SignalR at `/hubs/fleet` and is not a REST operation.
    Contract 1.2 adds three fictional plants: a site list, one plant with bay positions and
    wafer flow, and a comparison of the same tool family across plants. Tool records include siteId.
    Contracts v1.2 adds admin reset and named injector scenarios. Both are additive.
    contracts-v1.2 adds GET /api/incidents/{incidentId}/investigation (ADR-001 addendum).
    It returns the latest investigation for that incident, or 404 when none exists.
    The path is additive. Earlier clients stay compatible.
    contracts-v1.3 adds GET /api/investigations. The list is every investigation, newest first.
    The same version adds an optional siteId query on the alert, ticket, investigation, and CAPA lists.
    When siteId is set, the list keeps records for tools at that plant. An unknown plant returns an empty list.
    The paths and the query are additive. Earlier clients stay compatible.
    All names and data are synthetic.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local API
tags:
  - name: health
  - name: sites
  - name: fleet
  - name: incidents
  - name: investigations
  - name: capas
  - name: faults
  - name: admin
  - name: metrics
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: List the three fictional plants
      description: |
        Each plant includes its role, where it sits, its time zone, its bays, and the plant-level
        throughput numbers. Positions and wafer flow are on the plant detail.
      responses:
        "200":
          description: Plants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSummary"
  /api/sites/compare:
    get:
      tags: [sites]
      operationId: compareSites
      summary: Compare one tool family across plants
      description: |
        The same tool family at every plant. Each parameter has an average, a spread, an alarm rate,
        uptime, and yield. A discrepancy flag is set when a plant sits apart from the reference plant,
        with one plain-language sentence saying why.
      parameters:
        - $ref: "#/components/parameters/FamilyQuery"
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/sites/{siteId}:
    get:
      tags: [sites]
      operationId: getSite
      summary: One plant, with bays, tool positions, and wafer flow
      description: |
        Bays include each tool's position and status. Flows are the wafer path between bays.
        Throughput numbers are repeated for the plant and for each bay.
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tools:
    get:
      tags: [fleet]
      operationId: listTools
      summary: List the simulated tool fleet
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
  /api/tools/{toolId}:
    get:
      tags: [fleet]
      operationId: getTool
      summary: Tool detail, including chambers
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/alerts:
    get:
      tags: [fleet]
      operationId: listAlerts
      summary: SPC alerts, newest first
      description: |
        Optional toolId keeps one tool. Optional siteId keeps tools at that plant.
        An unknown plant returns an empty list. Omit both to list every alert.
      parameters:
        - $ref: "#/components/parameters/ToolIdQuery"
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /api/tickets:
    get:
      tags: [incidents]
      operationId: listTickets
      summary: Intake tickets, newest first
      description: |
        Optional siteId keeps tickets for tools at that plant. An unknown plant returns an empty list.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /api/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: Normalized incidents
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      tags: [incidents]
      operationId: openIncident
      summary: Operator or engineer report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenIncidentRequest"
      responses:
        "201":
          description: Incident opened, or linked to an existing open incident on the same tool and parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/incidents/{incidentId}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: One incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/incidents/{incidentId}/investigation:
    get:
      tags: [investigations]
      operationId: getLatestInvestigation
      summary: Latest investigation for an incident
      description: |
        Additive in contracts-v1.2 (ADR-001 addendum). Returns the latest investigation
        started for the incident. 404 when the incident is missing or no investigation
        has been started. A ticket id or a ticket number is not this path.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The latest investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/investigations:
    get:
      tags: [investigations]
      operationId: listInvestigations
      summary: All investigations, newest first
      description: |
        Additive in contracts-v1.3. Returns every investigation. A later start sorts
        before an earlier start on the same incident, and a newer incident sorts before an older one.
        Optional siteId keeps investigations whose incident tool is at that plant.
        An unknown plant returns an empty list.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Investigations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investigation"
  /api/investigations/{investigationId}:
    get:
      tags: [investigations]
      operationId: getInvestigation
      summary: Evidence, hypotheses, and stage
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: The investigation snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/incidents/{incidentId}/investigations:
    post:
      tags: [investigations]
      operationId: startInvestigation
      summary: Start investigation for an incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "201":
          description: Investigation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/investigations/{investigationId}/decisions:
    post:
      tags: [investigations]
      operationId: submitDecision
      summary: Approve, reject, or request more information
      description: |
        Approve requires approverId. The server issues a single-use approval token bound to the
        action hash and creates the CAPA. A client-supplied signature is not part of the schema and the request is rejected (400).
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanDecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Approval rejected by the token rules.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/capas:
    get:
      tags: [capas]
      operationId: listCapas
      summary: CAPA records, newest first
      description: |
        Optional siteId keeps corrective actions whose incident tool is at that plant.
        An unknown plant returns an empty list.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: CAPAs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capa"
  /api/capas/{capaId}:
    get:
      tags: [capas]
      operationId: getCapa
      summary: One CAPA
      parameters:
        - $ref: "#/components/parameters/CapaId"
      responses:
        "200":
          description: The CAPA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/capas/{capaId}/advance:
    post:
      tags: [capas]
      operationId: advanceCapa
      summary: Move a CAPA one legal stage forward
      parameters:
        - $ref: "#/components/parameters/CapaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceCapaRequest"
      responses:
        "200":
          description: Updated CAPA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/faults:
    post:
      tags: [faults]
      operationId: injectFault
      summary: Inject a simulated fault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaultInjectionRequest"
      responses:
        "202":
          description: Fault accepted. An alert follows from the simulator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultInjectionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/admin/session:
    get:
      tags: [admin]
      operationId: getAdminSession
      summary: Caller role for the demo console
      description: |
        Local mode with no X-MS-CLIENT-PRINCIPAL header is the local dev user and is an admin.
        In Azure the header is the Easy Auth principal. Role admin is required to reset the demo.
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
      responses:
        "200":
          description: Whether this caller may reset the demo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /api/admin/reset:
    post:
      tags: [admin]
      operationId: resetDemo
      summary: Restore the seeded demo baseline
      description: |
        Admin only. Restores fleet state, tickets, investigations, approvals, CAPAs, and the
        simulated clock from Mps:Demo:Seed (default 4242). The same seed is used locally and in Azure.
        A second call returns the same baseline.
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
      responses:
        "200":
          description: Baseline restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"
        "403":
          description: The caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/injector/scenarios:
    get:
      tags: [faults]
      operationId: listScenarios
      summary: Named scripted scenarios
      responses:
        "200":
          description: One scenario for each root-cause class.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptedScenario"
  /api/injector/scenarios/{scenarioId}:
    post:
      tags: [faults]
      operationId: runScenario
      summary: Run a named scripted scenario
      description: |
        Applies deterministic telemetry from Mps:Demo:Seed and records the fault.
        The free-form injector at POST /api/faults stays available.
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "202":
          description: Scenario accepted. Telemetry is the seeded series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Investigation health, latency, and spend
      responses:
        "200":
          description: Current metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
components:
  parameters:
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ToolIdQuery:
      name: toolId
      in: query
      required: false
      schema:
        type: string
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapaId:
      name: capaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SiteIdQuery:
      name: siteId
      in: query
      required: false
      description: Plant id. When set, the list keeps records for tools at that plant. An unknown plant returns an empty list.
      schema:
        type: string
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    FamilyQuery:
      name: family
      in: query
      required: true
      description: Tool family to compare. One of deposition, etch, strip, or clean.
      schema:
        $ref: "#/components/schemas/ToolFamily"
    ClientPrincipal:
      name: X-MS-CLIENT-PRINCIPAL
      in: header
      required: false
      description: Easy Auth client principal, base64 JSON. Absent in local mode.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The lifecycle rejected the transition, or the write was a duplicate.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
    ToolFamily:
      type: string
      enum: [deposition, etch, strip, clean]
    Tool:
      type: object
      additionalProperties: false
      required: [id, name, family, model, bay, siteId, chambers]
      properties:
        id:
          type: string
        name:
          type: string
        family:
          $ref: "#/components/schemas/ToolFamily"
        model:
          type: string
          description: Fictional model, for example MPS-E7.
        bay:
          type: string
        siteId:
          type: string
          description: Plant that owns this tool. Original tools stay on the first plant.
        chambers:
          type: array
          items:
            $ref: "#/components/schemas/Chamber"
    Chamber:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Severity:
      type: string
      enum: [low, medium, high, critical]
    IncidentChannel:
      type: string
      enum: [iotSpcAlert, operatorReport, qmsNonconformance, supplierQualityNotice, faultInjector]
    IncidentStage:
      type: string
      enum:
        - ticketOpened
        - investigating
        - recommendationReady
        - escalated
        - awaitingApproval
        - approved
        - rejected
        - closed
    Alert:
      type: object
      additionalProperties: false
      required: [id, toolId, parameter, severity, rule, raisedAt, correlationId]
      properties:
        id:
          type: string
          format: uuid
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        rule:
          type: string
        raisedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    Ticket:
      type: object
      additionalProperties: false
      required: [id, number, incidentId, toolId, title, openedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: "^TKT-.+"
        incidentId:
          type: string
          format: uuid
        toolId:
          type: string
        title:
          type: string
        openedAt:
          type: string
          format: date-time
    Incident:
      type: object
      additionalProperties: false
      required: [id, toolId, parameter, channel, severity, summary, correlationId, openedAt, stage]
      properties:
        id:
          type: string
          format: uuid
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        channel:
          $ref: "#/components/schemas/IncidentChannel"
        severity:
          $ref: "#/components/schemas/Severity"
        summary:
          type: string
        correlationId:
          type: string
        openedAt:
          type: string
          format: date-time
        stage:
          $ref: "#/components/schemas/IncidentStage"
    OpenIncidentRequest:
      type: object
      additionalProperties: false
      required: [toolId, parameter, summary]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        summary:
          type: string
          maxLength: 4000
        severity:
          $ref: "#/components/schemas/Severity"
    EvidenceSource:
      type: string
      enum: [telemetry, spc, mes, qms, plm, erp, cmms, document, ticketing]
    EvidenceItem:
      type: object
      additionalProperties: false
      required: [id, source, title, excerpt, observedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/EvidenceSource"
        title:
          type: string
        excerpt:
          type: string
        observedAt:
          type: string
          format: date-time
        toolId:
          type: string
          nullable: true
        externalRef:
          type: string
          nullable: true
        whyItMatters:
          type: string
          nullable: true
          maxLength: 240
          description: One plain-language sentence on why this evidence matters (ADR-003). Set by the agent; grounding validator checks it is attached to a cited evidence id.
        signalId:
          type: string
          nullable: true
          description: Sensor id from the fleet sensor catalog (data/fleet), when the evidence is a signal.
    EvidenceStance:
      type: string
      enum: [supports, rulesOut, neutral]
    EvidenceMatrixEntry:
      type: object
      additionalProperties: false
      required: [category, evidenceId, stance]
      properties:
        category:
          $ref: "#/components/schemas/RootCauseCategory"
        evidenceId:
          type: string
          format: uuid
        stance:
          $ref: "#/components/schemas/EvidenceStance"
        whyItMatters:
          type: string
          nullable: true
          maxLength: 240
    RootCauseCategory:
      type: string
      enum: [engineeringChange, equipmentCalibrationOrAlignment, supplyChainMaterial, processDrift]
    Hypothesis:
      type: object
      additionalProperties: false
      required: [id, category, cause, confidence, evidenceIds, counterEvidence, actions]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/RootCauseCategory"
        cause:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidenceIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        counterEvidence:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
    InvestigationStage:
      type: string
      enum:
        - started
        - evidenceGathered
        - recommendationReady
        - escalated
        - awaitingApproval
        - approved
        - rejected
        - failed
    Investigation:
      type: object
      additionalProperties: false
      required: [id, incidentId, stage, evidence, hypotheses, correlationId]
      properties:
        evidenceMatrix:
          type: array
          description: Root-cause class to evidence stance matrix (UX3). Optional; empty until the Investigation Agent has ranked.
          items:
            $ref: "#/components/schemas/EvidenceMatrixEntry"
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
        hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/Hypothesis"
        escalationReason:
          type: string
          nullable: true
        correlationId:
          type: string
    HumanDecisionKind:
      type: string
      enum: [approve, reject, requestInfo, override]
    HumanDecisionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/HumanDecisionKind"
        comment:
          type: string
          nullable: true
          maxLength: 4000
        approverId:
          type: string
          description: Required when kind is approve. The server issues the token.
    DecisionResult:
      type: object
      additionalProperties: false
      required: [investigation]
      properties:
        investigation:
          $ref: "#/components/schemas/Investigation"
        capa:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Capa"
    CapaStage:
      type: string
      enum: [open, containment, rootCauseConfirmed, correctiveAction, verification, closed]
    Capa:
      type: object
      additionalProperties: false
      required: [id, incidentId, summary, approvalTokenId, actionHash, stage, openedAt]
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        summary:
          type: string
        approvalTokenId:
          type: string
          format: uuid
        actionHash:
          type: string
        stage:
          $ref: "#/components/schemas/CapaStage"
        openedAt:
          type: string
          format: date-time
    AdvanceCapaRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          $ref: "#/components/schemas/CapaStage"
    FaultShape:
      type: string
      enum: [step, ramp, oscillation, intermittent]
    FaultInjectionRequest:
      type: object
      additionalProperties: false
      required: [toolId, parameter, shape, magnitude, rootCauseCategory]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        shape:
          $ref: "#/components/schemas/FaultShape"
        magnitude:
          type: number
          description: Sigma multiple or percent, as labeled by the simulator.
        rootCauseCategory:
          $ref: "#/components/schemas/RootCauseCategory"
        confounders:
          type: boolean
          default: false
    FaultInjectionAccepted:
      type: object
      additionalProperties: false
      required: [faultId, correlationId]
      properties:
        faultId:
          type: string
          format: uuid
        correlationId:
          type: string
    AdminSession:
      type: object
      additionalProperties: false
      required: [mode, isAdmin, displayName]
      properties:
        mode:
          type: string
          enum: [local, azure]
        isAdmin:
          type: boolean
        displayName:
          type: string
    DemoResetResult:
      type: object
      additionalProperties: false
      required: [seed, simulatedOrigin, fleetToolCount, ticketCount, investigationCount, approvalCount, capaCount]
      properties:
        seed:
          type: integer
        simulatedOrigin:
          type: string
          format: date-time
        fleetToolCount:
          type: integer
        ticketCount:
          type: integer
        investigationCount:
          type: integer
        approvalCount:
          type: integer
        capaCount:
          type: integer
    ScriptedScenario:
      type: object
      additionalProperties: false
      required: [id, title, rootCauseCategory, toolIds, chamberId, parameter, shape, summary]
      properties:
        id:
          type: string
        title:
          type: string
        rootCauseCategory:
          $ref: "#/components/schemas/RootCauseCategory"
        toolIds:
          type: array
          items:
            type: string
        chamberId:
          type: string
        parameter:
          type: string
        shape:
          $ref: "#/components/schemas/FaultShape"
        summary:
          type: string
    ScenarioTelemetryPoint:
      type: object
      additionalProperties: false
      required: [toolId, chamberId, parameter, at, value]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
        parameter:
          type: string
        at:
          type: string
          format: date-time
        value:
          type: number
    ScenarioRun:
      type: object
      additionalProperties: false
      required: [scenarioId, seed, faultId, correlationId, telemetry]
      properties:
        scenarioId:
          type: string
        seed:
          type: integer
        faultId:
          type: string
          format: uuid
        correlationId:
          type: string
        telemetry:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioTelemetryPoint"
    MetricsSummary:
      type: object
      additionalProperties: false
      required: [mode, spendTodayUsd, spendCapUsd]
      properties:
        mode:
          type: string
          enum: [replay, live]
        completionRate:
          type: number
          nullable: true
        groundingScore:
          type: number
          nullable: true
        categoryAccuracy:
          type: number
          nullable: true
        toolFailureCount:
          type: integer
        latencyP95Ms:
          type: number
          nullable: true
        costPerInvestigationUsd:
          type: number
          nullable: true
        spendTodayUsd:
          type: number
        spendCapUsd:
          type: number
    SiteRole:
      type: string
      description: Plain-language role of the plant.
      enum:
        - Front-end wafer fab
        - Strip, clean, and pilot line
    ToolStatus:
      type: string
      description: Nominal is inside the normal band. Warning is drifting. Alarm is a scripted fault.
      enum: [nominal, warning, alarm]
    Throughput:
      type: object
      additionalProperties: false
      description: Wafers moving through a plant or a bay.
      required: [waferStartsPerHour, waferOutsPerHour, wip, yieldPct, uptimePct]
      properties:
        waferStartsPerHour:
          type: number
          description: Wafers that enter this plant or bay in one hour.
        waferOutsPerHour:
          type: number
          description: Wafers that finish this plant or bay in one hour.
        wip:
          type: integer
          description: Work in process. Wafers that have started and have not finished.
        yieldPct:
          type: number
          description: Percent of wafers that met the requirement.
        uptimePct:
          type: number
          description: Percent of scheduled time the tools were ready to run.
    SiteBaySummary:
      type: object
      additionalProperties: false
      required: [id, name, toolCount]
      properties:
        id:
          type: string
        name:
          type: string
        toolCount:
          type: integer
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, name, role, location, timezone, bays, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/SiteRole"
        location:
          type: string
          description: Fictional place name. Not a city tied to a real chip company.
        timezone:
          type: string
          description: Time-zone name, such as America/Denver, so clocks can be compared.
        bays:
          type: array
          items:
            $ref: "#/components/schemas/SiteBaySummary"
        kpis:
          $ref: "#/components/schemas/Throughput"
    PlacedTool:
      type: object
      additionalProperties: false
      required: [id, name, family, model, status, x, y, siteId]
      properties:
        id:
          type: string
        name:
          type: string
        family:
          $ref: "#/components/schemas/ToolFamily"
        model:
          type: string
        status:
          $ref: "#/components/schemas/ToolStatus"
        x:
          type: number
          description: Horizontal position in the bay, from 0 to 100.
        y:
          type: number
          description: Vertical position in the bay, from 0 to 100.
        siteId:
          type: string
    SiteBayDetail:
      type: object
      additionalProperties: false
      required: [id, name, tools, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PlacedTool"
        kpis:
          $ref: "#/components/schemas/Throughput"
    WaferFlow:
      type: object
      additionalProperties: false
      required: [fromBayId, toBayId, label]
      properties:
        fromBayId:
          type: string
        toBayId:
          type: string
        label:
          type: string
          description: Plain sentence for why wafers move from one bay to the next.
    SiteDetail:
      type: object
      additionalProperties: false
      required: [id, name, role, location, timezone, bays, flows, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/SiteRole"
        location:
          type: string
        timezone:
          type: string
        bays:
          type: array
          items:
            $ref: "#/components/schemas/SiteBayDetail"
        flows:
          type: array
          items:
            $ref: "#/components/schemas/WaferFlow"
        kpis:
          $ref: "#/components/schemas/Throughput"
    SiteParameterStats:
      type: object
      additionalProperties: false
      required: [siteId, siteName, mean, sigma, alarmRate, uptimePct, yieldPct, discrepancy, reason]
      properties:
        siteId:
          type: string
        siteName:
          type: string
        mean:
          type: number
          description: Average reading for this parameter on this tool family at this plant.
        sigma:
          type: number
          description: Spread of those readings around the average.
        alarmRate:
          type: number
          description: Share of readings outside the normal band, from 0 to 1.
        uptimePct:
          type: number
        yieldPct:
          type: number
        discrepancy:
          type: boolean
          description: True when this plant sits apart from the reference plant.
        reason:
          type: string
          nullable: true
          description: One plain sentence when discrepancy is true. Null when it is not.
    ParameterComparison:
      type: object
      additionalProperties: false
      required: [parameter, unit, sites]
      properties:
        parameter:
          type: string
        unit:
          type: string
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteParameterStats"
    FamilyComparison:
      type: object
      additionalProperties: false
      required: [family, referenceSiteId, parameters]
      properties:
        family:
          $ref: "#/components/schemas/ToolFamily"
        referenceSiteId:
          type: string
          description: The plant the others are compared with. A discrepancy is measured from this plant.
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterComparison"
