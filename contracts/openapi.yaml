openapi: 3.0.3
info:
  title: Meridian Precision Systems Quality API
  version: 1.4.0
  description: |
    Console API for the fictional Meridian Precision Systems quality-investigation demo.
    Every intake channel becomes one incident. A CAPA is created only after a human approval,
    and the server issues the approval token. Clients do not send token signatures.
    The fleet stream is SignalR at `/hubs/fleet` and is not a REST operation.
    Contract 1.2 adds three fictional plants: a site list, one plant with bay positions and
    wafer flow, and a comparison of the same tool family across plants. Tool records include siteId.
    Contracts v1.2 adds admin reset and named injector scenarios. Both are additive.
    contracts-v1.2 adds GET /api/incidents/{incidentId}/investigation (ADR-001 addendum).
    It returns the latest investigation for that incident, or 404 when none exists.
    The path is additive. Earlier clients stay compatible.
    Contract 1.3 adds presenter copy on each scripted scenario: whatsHappening, whatWeSimulate,
    whatAiShouldFind, and expectedCause. The fields are additive.
    Contract 1.3 also adds optional siteId on alerts, tickets, incidents, investigations, and CAPA records,
    an optional siteId query on those lists and on tools, GET /api/fleet/live, GET /api/tools/{toolId}/live,
    and GET /api/investigations. Omitting siteId leaves the original lists unchanged.
    contracts-v1.3 adds GET /api/investigations. The list is every investigation, newest first.
    The same version adds an optional siteId query on the alert, ticket, investigation, and CAPA lists.
    When siteId is set, the list keeps records for tools at that plant. An unknown plant returns an empty list.
    The paths and the query are additive. Earlier clients stay compatible.
    GET /api/audit is additive and read-only. It returns the audit trail and correlation traces.
    List routes accept an optional siteId query. Omit it to return every plant.
    EvidenceItem gains optional value, unit, specLow, specHigh, toolName, and chamberName.
    Clients that ignore unknown fields stay compatible.
    Contract 1.3 adds printout inspect and confirm. Both are additive. A confirmed bench
    reading is stored as evidence with source manualMeasurement.
    Contract 1.4 adds read-only plant metadata: the company, each site with its capabilities,
    production lines, and tools, one tool with its limits, the business rules, and the process maps.
    The paths are additive. Earlier clients stay compatible.
    Contract 1.5 adds GET /api/trace/{eventId}. The path returns the ancestors of one
    event and the tree of events that followed it. EvidenceItem gains optional sourceEventIds,
    the events that item was derived from. Both additions are optional for older clients.
    All names and data are synthetic.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local API
tags:
  - name: health
  - name: sites
  - name: fleet
  - name: incidents
  - name: investigations
  - name: capas
  - name: faults
  - name: printouts
  - name: admin
  - name: audit
  - name: metrics
  - name: trace
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: List the three fictional plants
      description: |
        Each plant includes its role, where it sits, its time zone, its bays, and the plant-level
        throughput numbers. Positions and wafer flow are on the plant detail.
      responses:
        "200":
          description: Plants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSummary"
  /api/sites/compare:
    get:
      tags: [sites]
      operationId: compareSites
      summary: Compare one tool family across plants
      description: |
        The same tool family at every plant. Each parameter has an average, a spread, an alarm rate,
        uptime, and yield. A discrepancy flag is set when a plant sits apart from the reference plant,
        with one plain-language sentence saying why.
      parameters:
        - $ref: "#/components/parameters/FamilyQuery"
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/sites/{siteId}:
    get:
      tags: [sites]
      operationId: getSite
      summary: One plant, with bays, tool positions, and wafer flow
      description: |
        Bays include each tool's position and status. Flows are the wafer path between bays.
        Throughput numbers are repeated for the plant and for each bay.
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tools:
    get:
      tags: [fleet]
      operationId: listTools
      summary: List the simulated tool fleet
      description: |
        Without siteId this is the original eight tools. With siteId it is every tool at that plant.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
  /api/tools/{toolId}:
    get:
      tags: [fleet]
      operationId: getTool
      summary: Tool detail, including chambers
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/fleet/live:
    get:
      tags: [fleet]
      operationId: listFleetLive
      summary: Latest reading for every simulated tool
      description: |
        Empty tools means the simulator has not published a sample yet. The console keeps its static tiles in that case.
      responses:
        "200":
          description: Live fleet snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetLive"
  /api/tools/{toolId}/live:
    get:
      tags: [fleet]
      operationId: getToolLive
      summary: Live readings and SPC series for one tool
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: Live tool snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolLive"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/alerts:
    get:
      tags: [fleet]
      operationId: listAlerts
      summary: SPC alerts, newest first
      description: |
        Optional toolId keeps one tool. Optional siteId keeps tools at that plant.
        An unknown plant returns an empty list. Omit both to list every alert.
      parameters:
        - $ref: "#/components/parameters/ToolIdQuery"
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /api/tickets:
    get:
      tags: [incidents]
      operationId: listTickets
      summary: Intake tickets, newest first
      description: |
        Optional siteId keeps tickets for tools at that plant. An unknown plant returns an empty list.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /api/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: Normalized incidents
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      tags: [incidents]
      operationId: openIncident
      summary: Operator or engineer report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenIncidentRequest"
      responses:
        "201":
          description: Incident opened, or linked to an existing open incident on the same tool and parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/incidents/{incidentId}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: One incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/incidents/{incidentId}/investigation:
    get:
      tags: [investigations]
      operationId: getLatestInvestigation
      summary: Latest investigation for an incident
      description: |
        Additive in contracts-v1.2 (ADR-001 addendum). Returns the latest investigation
        started for the incident. 404 when the incident is missing or no investigation
        has been started. A ticket id or a ticket number is not this path.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The latest investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/investigations:
    get:
      tags: [investigations]
      operationId: listInvestigations
      summary: All investigations, newest first
      description: |
        Additive in contracts-v1.3. Returns every investigation. A later start sorts
        before an earlier start on the same incident, and a newer incident sorts before an older one.
        Optional siteId keeps investigations whose incident tool is at that plant.
        An unknown plant returns an empty list.
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Investigations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investigation"
  /api/investigations/{investigationId}:
    get:
      tags: [investigations]
      operationId: getInvestigation
      summary: Evidence, hypotheses, and stage
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: The investigation snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/incidents/{incidentId}/investigations:
    post:
      tags: [investigations]
      operationId: startInvestigation
      summary: Start investigation for an incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "201":
          description: Investigation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/investigations/{investigationId}/decisions:
    post:
      tags: [investigations]
      operationId: submitDecision
      summary: Approve, reject, or request more information
      description: |
        Approve requires approverId. The server issues a single-use approval token bound to the
        action hash and creates the CAPA. A client-supplied signature is not part of the schema and the request is rejected (400).
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanDecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Approval rejected by the token rules.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/capas:
    get:
      tags: [capas]
      operationId: listCapas
      summary: CAPA records
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: CAPAs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capa"
  /api/capas/{capaId}:
    get:
      tags: [capas]
      operationId: getCapa
      summary: One CAPA
      parameters:
        - $ref: "#/components/parameters/CapaId"
      responses:
        "200":
          description: The CAPA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/capas/{capaId}/advance:
    post:
      tags: [capas]
      operationId: advanceCapa
      summary: Move a CAPA one legal stage forward
      parameters:
        - $ref: "#/components/parameters/CapaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceCapaRequest"
      responses:
        "200":
          description: Updated CAPA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/faults:
    post:
      tags: [faults]
      operationId: injectFault
      summary: Inject a simulated fault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaultInjectionRequest"
      responses:
        "202":
          description: Fault accepted. An alert follows from the simulator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultInjectionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/printouts/inspect:
    post:
      tags: [printouts]
      operationId: inspectPrintout
      summary: Read a bench printout
      description: |
        Accepts a PDF or an image. A text layer is read first. A scan is sent through the model gateway.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted reading, ready for the engineer to correct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintoutInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/printouts/confirm:
    post:
      tags: [printouts]
      operationId: confirmPrintout
      summary: Store a corrected bench reading
      description: |
        Stores the reading as evidence. A value outside the printed spec is applied to the simulation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintoutConfirmRequest"
      responses:
        "200":
          description: Evidence stored. A fault id is present only when the reading is outside the printed spec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintoutConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/manual-readings:
    get:
      tags: [printouts]
      operationId: listManualReadings
      summary: Confirmed bench readings, newest observed first
      parameters:
        - name: toolId
          in: query
          required: false
          schema: { type: string }
        - name: siteId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Manual readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualReading"
  /api/manual-readings/{evidenceId}/file:
    get:
      tags: [printouts]
      operationId: getManualReadingFile
      summary: The uploaded printout sheet for a manual reading
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The original file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: No file was kept for this reading
  /api/admin/session:
    get:
      tags: [admin]
      operationId: getAdminSession
      summary: Caller role for the demo console
      description: |
        Local mode with no X-MS-CLIENT-PRINCIPAL header is the local dev user and is an admin.
        In Azure the header is the Easy Auth principal. Role admin is required to reset the demo.
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
      responses:
        "200":
          description: Whether this caller may reset the demo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /api/admin/reset/progress:
    get:
      tags: [admin]
      operationId: getResetProgress
      summary: Latest hard or soft reset phase
      description: |
        The reset request updates this snapshot while it runs. The harness polls it so the console stays usable.
        Anyone may read it. Only an admin may start a reset.
      responses:
        "200":
          description: Idle, running, finished, or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetProgress"
  /api/admin/reset:
    post:
      tags: [admin]
      operationId: resetDemo
      summary: Hard or soft demo reset
      description: |
        Admin only. An empty body or kind hard wipes transactional data, keeps metadata, rebuilds the
        eight-tool fleet, and fills a week of healthy history. Kind soft deletes nothing. It closes open
        tickets, investigations, and pending approvals with the status Closed by demo reset, clears live
        faults, and sends one healthy reading for every sensor. History stays. The same seed is used
        locally and in Azure (Mps:Demo:Seed, default 4242).
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoResetRequest"
      responses:
        "200":
          description: Baseline restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"
        "403":
          description: The caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/demo/data-mode:
    get:
      tags: [admin]
      operationId: getDataMode
      summary: Whether the console is showing live plant data or a recorded scenario
      description: |
        Live follows the running plant. Replay shows one recorded scenario.
        This does not change saved answers versus a live model.
      responses:
        "200":
          description: Current data mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataMode"
    post:
      tags: [admin]
      operationId: setDataMode
      summary: Switch the console between live plant data and a recorded scenario
      description: |
        Admin only. Live restores the running plant view. Replay loads data/replay for that scenario.
        The recording is kept when switching back to live.
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataModeRequest"
      responses:
        "200":
          description: The mode now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataMode"
        "403":
          description: The caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The scenario is unknown or has no recording.
  /api/admin/replay/{scenarioId}:
    post:
      tags: [admin]
      operationId: recordScenarioReplay
      summary: Record one scenario run onto the bus and save it
      description: |
        Admin only. Runs the scenario and writes the bus messages to data/replay for that scenario.
        Saved model answers are left alone.
      parameters:
        - $ref: "#/components/parameters/ClientPrincipal"
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: How many bus messages were saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayCapture"
        "403":
          description: The caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The scenario is unknown.
  /api/injector/scenarios:
    get:
      tags: [faults]
      operationId: listScenarios
      summary: Named scripted scenarios
      responses:
        "200":
          description: One scenario for each root-cause class.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptedScenario"
  /api/injector/scenarios/{scenarioId}:
    post:
      tags: [faults]
      operationId: runScenario
      summary: Run a named scripted scenario
      description: |
        Applies deterministic telemetry from Mps:Demo:Seed and records the fault.
        The free-form injector at POST /api/faults stays available.
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "202":
          description: Scenario accepted. Telemetry is the seeded series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/injector/stop:
    post:
      tags: [faults]
      operationId: stopScenario
      summary: Stop the running scenario and injected faults
      description: |
        Removes every injected fault so telemetry returns to nominal. Alerts, tickets and other records stay.
      responses:
        "200":
          description: Faults removed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: integer
  /api/audit:
    get:
      tags: [audit]
      operationId: getAuditLog
      summary: Audit trail and correlation traces
      description: |
        Read-only. Each entry is one recorded step (fault, alert, ticket, incident, investigation,
        approval, or corrective action). Traces group the steps that share a correlation id.
        Operator screens do not show these ids.
      responses:
        "200":
          description: The audit log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"
  /api/metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Investigation health, latency, and spend
      responses:
        "200":
          description: Current metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
  /api/metadata/company:
    get:
      tags: [metadata]
      operationId: getCompanyMetadata
      summary: Company profile and metadata load time
      responses:
        "200":
          description: The company, plus how long the metadata load took.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMetadata"
  /api/metadata/sites:
    get:
      tags: [metadata]
      operationId: listMetadataSites
      summary: Sites, capabilities, production lines, and tools
      responses:
        "200":
          description: Every site with its capabilities. Manufacturing lines include their tools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetadataSite"
  /api/metadata/tools/{toolId}:
    get:
      tags: [metadata]
      operationId: getMetadataTool
      summary: One tool, with limits, inputs, and outputs
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: The tool and its parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataTool"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/metadata/rules:
    get:
      tags: [metadata]
      operationId: listBusinessRules
      summary: Business rules in plain language
      responses:
        "200":
          description: Rules in the order they are evaluated. The first match wins.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessRule"
  /api/metadata/process-maps:
    get:
      tags: [metadata]
      operationId: listProcessMaps
      summary: Current-state and future-state process maps
      responses:
        "200":
          description: Ordered steps and the transitions between them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessMap"
  /api/trace/{eventId}:
    get:
      tags: [trace]
      operationId: getCausalTrace
      summary: Ancestors and descendants of one event
      description: |
        Walks parent links, then causation, across the event log and the telemetry table.
        Ancestors are root-first and do not include the focus. The tree is rooted at the focus.
        Unknown ids return 404.
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The causal trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CausalTrace"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ToolIdQuery:
      name: toolId
      in: query
      required: false
      schema:
        type: string
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CapaId:
      name: capaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SiteIdQuery:
      name: siteId
      in: query
      required: false
      description: Plant id. When set, the list keeps records for tools at that plant. An unknown plant returns an empty list.
      schema:
        type: string
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    FamilyQuery:
      name: family
      in: query
      required: true
      description: Tool family to compare. One of deposition, etch, strip, or clean.
      schema:
        $ref: "#/components/schemas/ToolFamily"
    ClientPrincipal:
      name: X-MS-CLIENT-PRINCIPAL
      in: header
      required: false
      description: Easy Auth client principal, base64 JSON. Absent in local mode.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The lifecycle rejected the transition, or the write was a duplicate.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
    ToolFamily:
      type: string
      enum: [deposition, etch, strip, clean]
    Tool:
      type: object
      additionalProperties: false
      required: [id, name, family, model, bay, siteId, chambers]
      properties:
        id:
          type: string
        name:
          type: string
        family:
          $ref: "#/components/schemas/ToolFamily"
        model:
          type: string
          description: Fictional model, for example MPS-E7.
        bay:
          type: string
        siteId:
          type: string
          description: Plant that owns this tool. Original tools stay on the first plant.
        chambers:
          type: array
          items:
            $ref: "#/components/schemas/Chamber"
    Chamber:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FleetLive:
      type: object
      additionalProperties: false
      required: [simulatedNow, tools]
      properties:
        simulatedNow:
          type: string
          format: date-time
        tools:
          type: array
          items:
            $ref: "#/components/schemas/FleetLiveTool"
    FleetLiveTool:
      type: object
      additionalProperties: false
      required: [toolId, siteId, status, readings]
      properties:
        toolId:
          type: string
        siteId:
          type: string
        status:
          type: string
          enum: [nominal, watch, alarm]
        readings:
          type: array
          items:
            $ref: "#/components/schemas/LiveReading"
    ToolLive:
      type: object
      additionalProperties: false
      required: [toolId, siteId, simulatedNow, status, readings, series]
      properties:
        toolId:
          type: string
        siteId:
          type: string
        simulatedNow:
          type: string
          format: date-time
        status:
          type: string
          enum: [nominal, watch, alarm]
        readings:
          type: array
          items:
            $ref: "#/components/schemas/LiveReading"
        series:
          type: array
          items:
            $ref: "#/components/schemas/LiveSeries"
    LiveReading:
      type: object
      additionalProperties: false
      required: [sensorId, parameter, chamberId, unit, at, value, status]
      properties:
        sensorId:
          type: string
        parameter:
          type: string
        chamberId:
          type: string
        unit:
          type: string
        at:
          type: string
          format: date-time
        value:
          type: number
        status:
          type: string
          enum: [nominal, watch, alarm]
    LiveSeries:
      type: object
      additionalProperties: false
      required: [parameter, chamberId, points]
      properties:
        parameter:
          type: string
        chamberId:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/LivePoint"
        center:
          type: number
          nullable: true
          description: Center line the rules engine checks. Null for cumulative counters.
        sigma:
          type: number
          nullable: true
          description: One sigma for the rules engine. Null for cumulative counters.
    LivePoint:
      type: object
      additionalProperties: false
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
    Severity:
      type: string
      enum: [low, medium, high, critical]
    IncidentChannel:
      type: string
      enum: [iotSpcAlert, operatorReport, qmsNonconformance, supplierQualityNotice, faultInjector]
    IncidentStage:
      type: string
      enum:
        - ticketOpened
        - investigating
        - recommendationReady
        - escalated
        - awaitingApproval
        - approved
        - rejected
        - closed
        - closedByDemoReset
    Alert:
      type: object
      additionalProperties: false
      required: [id, toolId, parameter, severity, rule, raisedAt, correlationId]
      properties:
        id:
          type: string
          format: uuid
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        rule:
          type: string
        raisedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        siteId:
          type: string
        status:
          type: string
          enum: [active, cleared]
          description: Active until the signal stays in control for 8 readings in a row.
        clearedAt:
          type: string
          format: date-time
          nullable: true
          description: Plant that owns the tool. Derived from the tool id.
    Ticket:
      type: object
      additionalProperties: false
      required: [id, number, incidentId, toolId, title, openedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: "^TKT-.+"
        incidentId:
          type: string
          format: uuid
        toolId:
          type: string
        title:
          type: string
        openedAt:
          type: string
          format: date-time
        siteId:
          type: string
          description: Plant that owns the tool. Derived from the tool id.
    Incident:
      type: object
      additionalProperties: false
      required: [id, toolId, parameter, channel, severity, summary, correlationId, openedAt, stage]
      properties:
        id:
          type: string
          format: uuid
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        channel:
          $ref: "#/components/schemas/IncidentChannel"
        severity:
          $ref: "#/components/schemas/Severity"
        summary:
          type: string
        correlationId:
          type: string
        openedAt:
          type: string
          format: date-time
        stage:
          $ref: "#/components/schemas/IncidentStage"
        siteId:
          type: string
          description: Plant that owns the tool. Derived from the tool id.
        statusLabel:
          type: string
          description: Plain-language status. Present only when a demo reset closed the incident.
    OpenIncidentRequest:
      type: object
      additionalProperties: false
      required: [toolId, parameter, summary]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        summary:
          type: string
          maxLength: 4000
        severity:
          $ref: "#/components/schemas/Severity"
    EvidenceSource:
      type: string
      enum: [telemetry, spc, mes, qms, plm, erp, cmms, document, ticketing, manualMeasurement]
    EvidenceItem:
      type: object
      additionalProperties: false
      required: [id, source, title, excerpt, observedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/EvidenceSource"
        title:
          type: string
        excerpt:
          type: string
        observedAt:
          type: string
          format: date-time
        toolId:
          type: string
          nullable: true
        externalRef:
          type: string
          nullable: true
        whyItMatters:
          type: string
          nullable: true
          maxLength: 240
          description: One plain-language sentence on why this evidence matters (ADR-003). Set by the agent; grounding validator checks it is attached to a cited evidence id.
        signalId:
          type: string
          nullable: true
          description: Sensor id from the fleet sensor catalog (data/fleet), when the evidence is a signal.
        value:
          type: number
          nullable: true
          description: Measured value when this evidence is a sensor or chart point. Absent for records that are not a reading.
        unit:
          type: string
          nullable: true
          description: Unit for value, such as C or Torr.
        specLow:
          type: number
          nullable: true
          description: Low end of the spec window for value.
        specHigh:
          type: number
          nullable: true
          description: High end of the spec window for value.
        toolName:
          type: string
          nullable: true
          description: Plain tool name, such as Etch tool E-02. The tool id stays on toolId.
        chamberName:
          type: string
          nullable: true
          description: Plain chamber name, such as Chamber B.
        sourceEventIds:
          type: array
          nullable: true
          description: Event ids this evidence was derived from. Absent when the item has none.
          items:
            type: string
    CausalTrace:
      type: object
      additionalProperties: false
      required: [focusEventId, rootEventId, ancestors, tree]
      properties:
        focusEventId:
          type: string
        rootEventId:
          type: string
        ancestors:
          type: array
          items:
            $ref: "#/components/schemas/TraceNode"
        tree:
          $ref: "#/components/schemas/TraceNode"
    TraceNode:
      type: object
      additionalProperties: false
      required: [eventId, type, summary, occurredAt, children, truncated]
      properties:
        eventId:
          type: string
        type:
          type: string
        summary:
          type: string
        occurredAt:
          type: string
          format: date-time
        toolId:
          type: string
          nullable: true
        toolName:
          type: string
          nullable: true
        value:
          type: number
          nullable: true
        limitLow:
          type: number
          nullable: true
        limitHigh:
          type: number
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/TraceNode"
        truncated:
          type: boolean
    EvidenceStance:
      type: string
      enum: [supports, rulesOut, neutral]
    EvidenceMatrixEntry:
      type: object
      additionalProperties: false
      required: [category, evidenceId, stance]
      properties:
        category:
          $ref: "#/components/schemas/RootCauseCategory"
        evidenceId:
          type: string
          format: uuid
        stance:
          $ref: "#/components/schemas/EvidenceStance"
        whyItMatters:
          type: string
          nullable: true
          maxLength: 240
    RootCauseCategory:
      type: string
      enum: [engineeringChange, equipmentCalibrationOrAlignment, supplyChainMaterial, processDrift]
    Hypothesis:
      type: object
      additionalProperties: false
      required: [id, category, cause, confidence, evidenceIds, counterEvidence, actions]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/RootCauseCategory"
        cause:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidenceIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        counterEvidence:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
    InvestigationStage:
      type: string
      enum:
        - started
        - evidenceGathered
        - recommendationReady
        - escalated
        - awaitingApproval
        - approved
        - rejected
        - failed
        - closedByDemoReset
    Investigation:
      type: object
      additionalProperties: false
      required: [id, incidentId, stage, evidence, hypotheses, correlationId]
      properties:
        evidenceMatrix:
          type: array
          description: Root-cause class to evidence stance matrix (UX3). Optional; empty until the Investigation Agent has ranked.
          items:
            $ref: "#/components/schemas/EvidenceMatrixEntry"
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
        hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/Hypothesis"
        escalationReason:
          type: string
          nullable: true
        correlationId:
          type: string
        siteId:
          type: string
          description: Plant that owns the incident tool. Derived at the HTTP edge.
        statusLabel:
          type: string
          description: Plain-language status. Present only when a demo reset closed the investigation.
    HumanDecisionKind:
      type: string
      enum: [approve, reject, requestInfo, override]
    HumanDecisionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/HumanDecisionKind"
        comment:
          type: string
          nullable: true
          maxLength: 4000
        approverId:
          type: string
          description: Required when kind is approve. The server issues the token.
    DecisionResult:
      type: object
      additionalProperties: false
      required: [investigation]
      properties:
        investigation:
          $ref: "#/components/schemas/Investigation"
        capa:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Capa"
    CapaStage:
      type: string
      enum: [open, containment, rootCauseConfirmed, correctiveAction, verification, closed]
    Capa:
      type: object
      additionalProperties: false
      required: [id, incidentId, summary, approvalTokenId, actionHash, stage, openedAt]
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        summary:
          type: string
        approvalTokenId:
          type: string
          format: uuid
        actionHash:
          type: string
        stage:
          $ref: "#/components/schemas/CapaStage"
        openedAt:
          type: string
          format: date-time
        siteId:
          type: string
          description: Plant that owns the incident tool. Derived at the HTTP edge.
        approvedBy:
          type: string
          nullable: true
          description: Display name of the person who approved. Absent until an approval is recorded.
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: When the approval was recorded. The console shows this in local time.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [at, kind, summary]
      properties:
        at:
          type: string
          format: date-time
        kind:
          type: string
          description: fault, alert, ticket, incident, investigation, approval, or capa.
        summary:
          type: string
        actor:
          type: string
          nullable: true
        toolId:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        recordId:
          type: string
          nullable: true
    CorrelationTrace:
      type: object
      additionalProperties: false
      required: [correlationId, events]
      properties:
        correlationId:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    AuditLog:
      type: object
      additionalProperties: false
      required: [entries, traces]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        traces:
          type: array
          items:
            $ref: "#/components/schemas/CorrelationTrace"
    AdvanceCapaRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          $ref: "#/components/schemas/CapaStage"
    FaultShape:
      type: string
      enum: [step, ramp, oscillation, intermittent]
    FaultInjectionRequest:
      type: object
      additionalProperties: false
      required: [toolId, parameter, shape, magnitude, rootCauseCategory]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        parameter:
          type: string
        shape:
          $ref: "#/components/schemas/FaultShape"
        magnitude:
          type: number
          description: Sigma multiple or percent, as labeled by the simulator.
        rootCauseCategory:
          $ref: "#/components/schemas/RootCauseCategory"
        confounders:
          type: boolean
          default: false
        durationMinutes:
          type: number
          minimum: 0
          description: Optional. The fault ends this many minutes after onset. Omit or 0 for no end.
    FaultInjectionAccepted:
      type: object
      additionalProperties: false
      required: [faultId, correlationId]
      properties:
        faultId:
          type: string
          format: uuid
        correlationId:
          type: string
    PrintoutInspection:
      type: object
      additionalProperties: false
      required: [toolId, observedAt, instrument, parameter, value, unit, specMinimum, specMaximum, parseMethod, outOfSpec]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
        instrument:
          type: string
          enum: [oscilloscope, rfPowerMeter, particleCounter, thermocoupleLogger]
        parameter:
          type: string
        value:
          type: number
        unit:
          type: string
        specMinimum:
          type: number
        specMaximum:
          type: number
        shape:
          type: string
          nullable: true
          enum: [step, ramp, oscillation, intermittent]
        operatorInitials:
          type: string
          nullable: true
        parseMethod:
          type: string
          enum: [text, model]
        outOfSpec:
          type: boolean
        fileId:
          type: string
          format: uuid
          nullable: true
          description: The uploaded file the server kept. Send it on confirm to attach the sheet as evidence.
    PrintoutConfirmRequest:
      type: object
      additionalProperties: false
      required: [toolId, observedAt, instrument, parameter, value, unit, specMinimum, specMaximum]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
        instrument:
          type: string
        parameter:
          type: string
        value:
          type: number
        unit:
          type: string
        specMinimum:
          type: number
        specMaximum:
          type: number
        shape:
          type: string
          nullable: true
        operatorInitials:
          type: string
          nullable: true
        printedObservedAt:
          type: string
          format: date-time
          nullable: true
          description: The time printed on the sheet when the user pressed Now. Kept on the record for the audit trail.
        fileId:
          type: string
          format: uuid
          nullable: true
    ManualReading:
      type: object
      additionalProperties: false
      required: [evidenceId, toolId, siteId, parameter, instrument, value, unit, specMinimum, specMaximum, outOfSpec, observedAt, olderThanWindow, source, active]
      properties:
        evidenceId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid, nullable: true, description: "The ticket the rules engine opened for this sample, if any." }
        alertId: { type: string, format: uuid, nullable: true }
        toolId: { type: string }
        siteId: { type: string }
        chamberId: { type: string, nullable: true }
        parameter: { type: string }
        instrument: { type: string }
        value: { type: number }
        unit: { type: string }
        specMinimum: { type: number }
        specMaximum: { type: number }
        outOfSpec: { type: boolean }
        observedAt: { type: string, format: date-time }
        printedObservedAt: { type: string, format: date-time, nullable: true }
        olderThanWindow: { type: boolean, description: True when the observed time is before the oldest point the chart window holds. }
        operatorInitials: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        fileUrl: { type: string, nullable: true }
        source: { type: string, description: Plain sentence naming the instrument and printout. }
        active: { type: boolean, description: "True while the alert this sample raised is still active. A resolved reading is history only." }
    PrintoutConfirmation:
      type: object
      additionalProperties: false
      required: [evidenceId, appliedToSimulation, outOfSpec, printedParameter, catalogParameter]
      properties:
        evidenceId:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
          nullable: true
        faultId:
          type: string
          format: uuid
          nullable: true
        correlationId:
          type: string
          nullable: true
        alertId:
          type: string
          format: uuid
          nullable: true
        appliedToSimulation:
          type: boolean
        outOfSpec:
          type: boolean
        printedParameter:
          type: string
        catalogParameter:
          type: string
    AdminSession:
      type: object
      additionalProperties: false
      required: [mode, isAdmin, displayName]
      properties:
        mode:
          type: string
          enum: [local, azure]
        isAdmin:
          type: boolean
        displayName:
          type: string
    DemoResetRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [hard, soft]
          description: Omitted or hard wipes transactional data. Soft closes open work and keeps history.
    ResetProgress:
      type: object
      additionalProperties: false
      required: [running, phase, message]
      properties:
        running:
          type: boolean
        kind:
          type: string
          nullable: true
        phase:
          type: string
        message:
          type: string
    DemoResetResult:
      type: object
      additionalProperties: false
      required: [seed, simulatedOrigin, fleetToolCount, ticketCount, investigationCount, approvalCount, capaCount, telemetryCount, eventCount, resetEventId, kind]
      properties:
        seed:
          type: integer
        simulatedOrigin:
          type: string
          format: date-time
        fleetToolCount:
          type: integer
        ticketCount:
          type: integer
        investigationCount:
          type: integer
        approvalCount:
          type: integer
        capaCount:
          type: integer
        telemetryCount:
          type: integer
          format: int64
        eventCount:
          type: integer
          format: int64
        resetEventId:
          type: string
        kind:
          type: string
          enum: [hard, soft]
    DataMode:
      type: object
      additionalProperties: false
      required: [mode, messageCount]
      properties:
        mode:
          type: string
          enum: [live, replay]
        scenarioId:
          type: string
          nullable: true
        messageCount:
          type: integer
    DataModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [live, replay]
        scenarioId:
          type: string
          description: Required when mode is replay.
    ReplayCapture:
      type: object
      additionalProperties: false
      required: [scenarioId, messageCount]
      properties:
        scenarioId:
          type: string
        messageCount:
          type: integer
    ScriptedScenario:
      type: object
      additionalProperties: false
      required: [id, title, rootCauseCategory, toolIds, chamberId, parameter, shape, summary, whatsHappening, whatWeSimulate, whatAiShouldFind, expectedCause]
      properties:
        id:
          type: string
        title:
          type: string
        rootCauseCategory:
          $ref: "#/components/schemas/RootCauseCategory"
        toolIds:
          type: array
          items:
            type: string
        chamberId:
          type: string
        parameter:
          type: string
        shape:
          $ref: "#/components/schemas/FaultShape"
        summary:
          type: string
        whatsHappening:
          type: string
        whatWeSimulate:
          type: string
        whatAiShouldFind:
          type: string
        expectedCause:
          type: string
    ScenarioTelemetryPoint:
      type: object
      additionalProperties: false
      required: [toolId, chamberId, parameter, at, value]
      properties:
        toolId:
          type: string
        chamberId:
          type: string
        parameter:
          type: string
        at:
          type: string
          format: date-time
        value:
          type: number
    ScenarioRun:
      type: object
      additionalProperties: false
      required: [scenarioId, seed, faultId, correlationId, telemetry]
      properties:
        scenarioId:
          type: string
        seed:
          type: integer
        faultId:
          type: string
          format: uuid
        correlationId:
          type: string
        telemetry:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioTelemetryPoint"
    MetricsSummary:
      type: object
      additionalProperties: false
      required: [mode, spendTodayUsd, spendCapUsd]
      properties:
        mode:
          type: string
          enum: [replay, live]
        completionRate:
          type: number
          nullable: true
        groundingScore:
          type: number
          nullable: true
        categoryAccuracy:
          type: number
          nullable: true
        toolFailureCount:
          type: integer
        latencyP95Ms:
          type: number
          nullable: true
        costPerInvestigationUsd:
          type: number
          nullable: true
          description: "Spend today divided by investigations that succeeded today; null (shown as n/a) when none succeeded."
        spendTodayUsd:
          type: number
        spendCapUsd:
          type: number
    SiteRole:
      type: string
      description: Plain-language role of the plant.
      enum:
        - Front-end wafer fab
        - Strip, clean, and pilot line
    ToolStatus:
      type: string
      description: Nominal is inside the normal band. Warning is drifting. Alarm is a scripted fault.
      enum: [nominal, warning, alarm]
    Throughput:
      type: object
      additionalProperties: false
      description: Wafers moving through a plant or a bay.
      required: [waferStartsPerHour, waferOutsPerHour, wip, yieldPct, uptimePct]
      properties:
        waferStartsPerHour:
          type: number
          description: Wafers that enter this plant or bay in one hour.
        waferOutsPerHour:
          type: number
          description: Wafers that finish this plant or bay in one hour.
        wip:
          type: integer
          description: Work in process. Wafers that have started and have not finished.
        yieldPct:
          type: number
          description: Percent of wafers that met the requirement.
        uptimePct:
          type: number
          description: Percent of scheduled time the tools were ready to run.
    SiteBaySummary:
      type: object
      additionalProperties: false
      required: [id, name, toolCount]
      properties:
        id:
          type: string
        name:
          type: string
        toolCount:
          type: integer
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, name, role, location, timezone, bays, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/SiteRole"
        location:
          type: string
          description: Fictional place name. Not a city tied to a real chip company.
        timezone:
          type: string
          description: Time-zone name, such as America/Denver, so clocks can be compared.
        bays:
          type: array
          items:
            $ref: "#/components/schemas/SiteBaySummary"
        kpis:
          $ref: "#/components/schemas/Throughput"
    PlacedTool:
      type: object
      additionalProperties: false
      required: [id, name, family, model, status, x, y, siteId]
      properties:
        id:
          type: string
        name:
          type: string
        family:
          $ref: "#/components/schemas/ToolFamily"
        model:
          type: string
        status:
          $ref: "#/components/schemas/ToolStatus"
        x:
          type: number
          description: Horizontal position in the bay, from 0 to 100.
        y:
          type: number
          description: Vertical position in the bay, from 0 to 100.
        siteId:
          type: string
    SiteBayDetail:
      type: object
      additionalProperties: false
      required: [id, name, tools, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PlacedTool"
        kpis:
          $ref: "#/components/schemas/Throughput"
    WaferFlow:
      type: object
      additionalProperties: false
      required: [fromBayId, toBayId, label]
      properties:
        fromBayId:
          type: string
        toBayId:
          type: string
        label:
          type: string
          description: Plain sentence for why wafers move from one bay to the next.
    SiteDetail:
      type: object
      additionalProperties: false
      required: [id, name, role, location, timezone, bays, flows, kpis]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/SiteRole"
        location:
          type: string
        timezone:
          type: string
        bays:
          type: array
          items:
            $ref: "#/components/schemas/SiteBayDetail"
        flows:
          type: array
          items:
            $ref: "#/components/schemas/WaferFlow"
        kpis:
          $ref: "#/components/schemas/Throughput"
    SiteParameterStats:
      type: object
      additionalProperties: false
      required: [siteId, siteName, mean, sigma, alarmRate, uptimePct, yieldPct, discrepancy, reason]
      properties:
        siteId:
          type: string
        siteName:
          type: string
        mean:
          type: number
          description: Average reading for this parameter on this tool family at this plant.
        sigma:
          type: number
          description: Spread of those readings around the average.
        alarmRate:
          type: number
          description: Share of readings outside the normal band, from 0 to 1.
        uptimePct:
          type: number
        yieldPct:
          type: number
        discrepancy:
          type: boolean
          description: True when this plant sits apart from the reference plant.
        reason:
          type: string
          nullable: true
          description: One plain sentence when discrepancy is true. Null when it is not.
    ParameterComparison:
      type: object
      additionalProperties: false
      required: [parameter, unit, sites]
      properties:
        parameter:
          type: string
        unit:
          type: string
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteParameterStats"
    FamilyComparison:
      type: object
      additionalProperties: false
      required: [family, referenceSiteId, parameters]
      properties:
        family:
          $ref: "#/components/schemas/ToolFamily"
        referenceSiteId:
          type: string
          description: The plant the others are compared with. A discrepancy is measured from this plant.
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterComparison"
    CompanyMetadata:
      type: object
      additionalProperties: false
      required: [id, name, purpose, description, industry, loadMilliseconds]
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        description:
          type: string
        industry:
          type: string
        loadMilliseconds:
          type: number
          minimum: 0
    MetadataToolCard:
      type: object
      additionalProperties: false
      required: [id, name, toolType, simulated]
      properties:
        id:
          type: string
        name:
          type: string
        toolType:
          type: string
        simulated:
          type: boolean
    MetadataLine:
      type: object
      additionalProperties: false
      required: [id, name, lineType, sequence, characteristics, stepNames, tools]
      properties:
        id:
          type: string
        name:
          type: string
        lineType:
          type: string
        sequence:
          type: integer
        characteristics:
          type: string
        stepNames:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MetadataToolCard"
    MetadataCapability:
      type: object
      additionalProperties: false
      required: [id, name, type, description, simulated, lines, directTools]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [manufacturing, warehousing, researchAndDevelopment, sales, backOffice, other]
        description:
          type: string
        simulated:
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/MetadataLine"
        directTools:
          type: array
          items:
            $ref: "#/components/schemas/MetadataToolCard"
    MetadataSite:
      type: object
      additionalProperties: false
      required: [id, name, purpose, description, timezone, capabilities]
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        description:
          type: string
        timezone:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/MetadataCapability"
    MetadataPort:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
    MetadataParameter:
      type: object
      additionalProperties: false
      required: [id, name, parameterClass, unit, lcl, ucl, alertLow, alertHigh, nominal, telemetry]
      properties:
        id:
          type: string
        name:
          type: string
        parameterClass:
          type: string
        unit:
          type: string
        lcl:
          type: number
        ucl:
          type: number
        alertLow:
          type: number
        alertHigh:
          type: number
        nominal:
          type: number
        telemetry:
          type: boolean
    MetadataTool:
      type: object
      additionalProperties: false
      required: [id, name, toolType, siteId, siteName, simulated, inputs, outputs, parameters]
      properties:
        id:
          type: string
        name:
          type: string
        toolType:
          type: string
        siteId:
          type: string
        siteName:
          type: string
        lineId:
          type: string
          nullable: true
        lineName:
          type: string
          nullable: true
        capabilityId:
          type: string
          nullable: true
        simulated:
          type: boolean
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/MetadataPort"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/MetadataPort"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataParameter"
    RuleAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [open-ticket, set-priority, route-to-queue, escalate-to-human, auto-investigate]
        priority:
          type: string
          nullable: true
        queue:
          type: string
          nullable: true
    BusinessRule:
      type: object
      additionalProperties: false
      required: [id, name, whenPlain, thenPlain, why, order, actions]
      properties:
        id:
          type: string
        name:
          type: string
        whenPlain:
          type: string
        thenPlain:
          type: string
        why:
          type: string
        order:
          type: integer
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RuleAction"
    ProcessStep:
      type: object
      additionalProperties: false
      required: [id, name, order, highlightStages]
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
        detail:
          type: string
          nullable: true
        highlightStages:
          type: array
          items:
            $ref: "#/components/schemas/IncidentStage"
    ProcessTransition:
      type: object
      additionalProperties: false
      required: [from, to, name]
      properties:
        from:
          type: string
        to:
          type: string
        name:
          type: string
    ProcessMap:
      type: object
      additionalProperties: false
      required: [id, name, state, steps, transitions]
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [current, future]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ProcessStep"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/ProcessTransition"
