<g id="s0"><rect x="2116" y="226" width="400" height="154" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><rect x="2116" y="226" width="8" height="154" fill="#047857"/>
<text x="2136" y="258" font-size="22" font-weight="600" fill="#065F46">Metadata store <tspan fill="#B45309" font-weight="700">*</tspan></text>
<text x="2136" y="286" font-size="18" fill="#1F2937">Company, site, capability, line, tool,</text>
<text x="2136" y="312" font-size="18" fill="#1F2937">parameter, limits, rules, process maps</text>
<text x="2136" y="338" font-size="18" fill="#1F2937">Relational (Azure SQL)</text>
</g>
<g id="s1"><rect x="2116" y="398" width="400" height="124" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><rect x="2116" y="398" width="8" height="124" fill="#047857"/>
<text x="2136" y="430" font-size="22" font-weight="600" fill="#065F46">Telemetry store <tspan fill="#B45309" font-weight="700">*</tspan></text>
<text x="2136" y="458" font-size="18" fill="#1F2937">Time series (Azure Data Explorer)</text>
<text x="2136" y="484" font-size="18" fill="#1F2937">Retention policy, fast windows</text>
</g>
<g id="s2"><rect x="2116" y="540" width="400" height="124" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><rect x="2116" y="540" width="8" height="124" fill="#047857"/>
<text x="2136" y="572" font-size="22" font-weight="600" fill="#065F46">Transaction store <tspan fill="#B45309" font-weight="700">*</tspan></text>
<text x="2136" y="600" font-size="18" fill="#1F2937">Alerts, tickets, investigations,</text>
<text x="2136" y="626" font-size="18" fill="#1F2937">approvals, CAPA, audit (Azure SQL)</text>
</g>
<g id="s3"><rect x="2116" y="682" width="400" height="124" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><rect x="2116" y="682" width="8" height="124" fill="#047857"/>
<text x="2136" y="714" font-size="22" font-weight="600" fill="#065F46">Causal graph <tspan fill="#B45309" font-weight="700">*</tspan></text>
<text x="2136" y="742" font-size="18" fill="#1F2937">Event lineage and genealogy</text>
<text x="2136" y="768" font-size="18" fill="#1F2937">Graph store, optional (Cosmos DB)</text>
</g>
<g id="u0"><rect x="2116" y="910" width="400" height="154" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><rect x="2116" y="910" width="8" height="154" fill="#0F766E"/>
<text x="2136" y="942" font-size="22" font-weight="600" fill="#115E59">Meridian FabOps console</text>
<text x="2136" y="970" font-size="18" fill="#1F2937">Sites, fleet, alerts, tickets,</text>
<text x="2136" y="996" font-size="18" fill="#1F2937">investigation, approval, CAPA,</text>
<text x="2136" y="1022" font-size="18" fill="#1F2937">rules and process, causal trace</text>
</g>
<g id="u1"><rect x="2116" y="1082" width="400" height="94" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><rect x="2116" y="1082" width="8" height="94" fill="#0F766E"/>
<text x="2136" y="1114" font-size="22" font-weight="600" fill="#115E59">Live push</text>
<text x="2136" y="1142" font-size="18" fill="#1F2937">SignalR fed by bus subscriptions</text>
</g>
<g id="x0"><rect x="586" y="1318" width="1930" height="124" rx="8" fill="#FFFFFF" stroke="#A16207" stroke-width="2"/><rect x="586" y="1318" width="8" height="124" fill="#A16207"/>
<text x="606" y="1350" font-size="22" font-weight="600" fill="#7A5C00">Every layer is a bus participant</text>
<text x="606" y="1378" font-size="18" fill="#1F2937">Rules, SPC, lifecycle, agents, stores and live push subscribe to typed topics and publish results with causationId set to the triggering event,</text>
<text x="606" y="1404" font-size="18" fill="#1F2937">so one fault command fans out into readings, alert, ticket, investigation steps, approval and CAPA, all on one correlationId.</text>
</g>
<rect x="48" y="1486" width="1580" height="210" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2"/><text x="64" y="1516" font-size="20" font-weight="700" fill="#0B1B33">NOTES</text>
<text x="64" y="1548" font-size="19" fill="#111827">* The running demo is intentionally thin. One Azure Container App, one replica, hosts the API, simulator and agents.</text>
<text x="64" y="1578" font-size="19" fill="#111827">* Demo bus: in-process, same envelope and command catalog (ADR-008). Measured: 7-day nominal seed, 466,662 readings in 7 s (~66k events/s).</text>
<text x="64" y="1608" font-size="19" fill="#111827">* Demo stores: metadata in YAML loaded at startup (ADR-009); telemetry, event log and transactions in SQLite; 7-day chart read under 1 ms.</text>
<text x="64" y="1638" font-size="19" fill="#111827">* Demo tools: three simulated plants; only the Manufacturing capability is simulated. Document search runs in process.</text>
<text x="64" y="1668" font-size="19" fill="#111827">Every telemetry reading, alert, ticket, investigation step, approval, CAPA and command travels through the event backbone.</text>
