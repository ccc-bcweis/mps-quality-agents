<g id="doc"><rect x="1096" y="930" width="400" height="120" rx="8" fill="#FFFFFF" stroke="#A16207" stroke-width="2"/><rect x="1096" y="930" width="8" height="120" fill="#A16207"/>
<text x="1116" y="962" font-size="22" font-weight="600" fill="#7A5C00">Uploaded document</text>
<text x="1116" y="990" font-size="18" fill="#1F2937">instrument printout, readings found</text>
<text x="1116" y="1016" font-size="18" fill="#1F2937">confirmed by (person)</text>
</g>
<rect x="48" y="1486" width="1580" height="210" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2"/><text x="64" y="1516" font-size="20" font-weight="700" fill="#0B1B33">NOTES</text>
<text x="64" y="1548" font-size="19" fill="#111827">* Demo store is intentionally thin: metadata lives in YAML files with exactly this structure; transactions and telemetry live in SQLite.</text>
<text x="64" y="1578" font-size="19" fill="#111827">* Target store: relational (Azure SQL) for metadata and transactions, time series for telemetry, optional graph store for event lineage.</text>
<text x="64" y="1608" font-size="19" fill="#111827">* Every transaction row keeps the eventId that created it, so any item can be traced back through causationId and parentEventId to its root.</text>
<text x="64" y="1638" font-size="19" fill="#111827">* Hard reset keeps every metadata entity and purges every transaction entity, then seeds nominal telemetry. Soft reset keeps all rows.</text>
<text x="64" y="1668" font-size="19" fill="#111827">FK = reference to another entity. Capability types are all modeled; only Manufacturing is simulated in the demo.</text>
