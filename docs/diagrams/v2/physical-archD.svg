<rect x="48" y="1486" width="1580" height="210" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2"/><text x="64" y="1516" font-size="20" font-weight="700" fill="#0B1B33">NOTES</text>
<text x="64" y="1548" font-size="19" fill="#111827">* Running demo today: ONE Container App (mpsdemo-api, 1 replica) in rg-mps-demo holds the web console, API, simulator, agents and mock systems.</text>
<text x="64" y="1578" font-size="19" fill="#111827">* Demo messaging: in-process bus in that container instead of IoT Hub, Event Hubs and Service Bus. Same envelope, so it can be swapped later.</text>
<text x="64" y="1608" font-size="19" fill="#111827">* Demo storage: SQLite on the container plus YAML metadata instead of Azure SQL and Data Explorer; data resets on redeploy by design.</text>
<text x="64" y="1638" font-size="19" fill="#111827">* Not deployed in the demo: Front Door, WAF, API Management, AI Search, separate workers. Deployed: Entra ID, Key Vault, managed identity,</text>
<text x="64" y="1668" font-size="19" fill="#111827">  Container Registry, Azure OpenAI, App Insights and Log Analytics. Deploys run from GitHub Actions with OIDC, no stored cloud secrets.</text>
