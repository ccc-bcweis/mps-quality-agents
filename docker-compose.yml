# Local run. Not deployed. Do not put secret values in this file.
# One image, the same one the hosted demo runs: the built console is served by the API on port 8080.
# Copy .env.example to .env first. Replay mode starts with the defaults below and needs no model key.

services:
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      LLM_MODE: ${LLM_MODE:-replay}
      ConnectionStrings__Mps: Data Source=/app/data/mps.db
      OTEL_SERVICE_NAME: Mps.Api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_OTLP_API_KEY:-local-dev-only}
    depends_on:
      - aspire-dashboard

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    ports:
      - "18888:18888"
      - "18889:18889"
    environment:
      ASPNETCORE_URLS: http://+:18888
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_OTLP_API_KEY:-local-dev-only}
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
