# Local skeleton. Not deployed. Do not put secret values in this file.
# Copy .env.example to .env before live mode. Replay mode starts with the defaults below.

services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      LLM_MODE: ${LLM_MODE:-replay}
      ConnectionStrings__Mps: ${ConnectionStrings__Mps:-Data Source=/tmp/mps.db}
      OTEL_SERVICE_NAME: Mps.Api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_OTLP_API_KEY:-local-dev-only}
    depends_on:
      - aspire-dashboard

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "5173:80"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    ports:
      - "18888:18888"
      - "18889:18889"
    environment:
      ASPNETCORE_URLS: http://+:18888
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_OTLP_API_KEY:-local-dev-only}
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
